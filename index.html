    &lt;section class="rounded-3xl border bg-white p-5 space-y-3" id="rigPanel"&gt;

&lt;div class="rig-grid"&gt;&lt;section class="rig-card"&gt;&lt;h3&gt;연통 고정링&lt;/h3&gt;&lt;label&gt;고정링 마디 &lt;input type="range" min="0" step="1" id="ringJoint"&gt;&lt;/label&gt;
      &lt;div class="rig-picks"&gt;&lt;button type="button" id="ring73"&gt;Ø73 마디&lt;/button&gt; &lt;button type="button" id="ring76"&gt;Ø76 마디&lt;/button&gt;&lt;/div&gt;
      &lt;div id="ringInfo"&gt;&lt;/div&gt;
      &lt;/section&gt;&lt;section class="rig-card"&gt;&lt;h3&gt;연통 받침대 · 지지대&lt;/h3&gt;&lt;label id="supportChoice"&gt;90° 수평에서 사용할 부품 &lt;select id="horizontalSupport" class="rounded-lg border p-2"&gt;&lt;option value="rest"&gt;받침대만&lt;/option&gt;&lt;option value="pole"&gt;지지대만&lt;/option&gt;&lt;option value="both"&gt;받침대와 지지대&lt;/option&gt;&lt;/select&gt;&lt;/label&gt;&lt;p id="supportModeNote"&gt;&lt;/p&gt;&lt;fieldset class="text-xs space-x-2"&gt;&lt;legend class="font-bold"&gt;도면에 표시할 설치 높이&lt;/legend&gt;&lt;label&gt;&lt;input id="restHeightOn" type="checkbox" checked&gt; 연통 받침대&lt;/label&gt; &lt;label&gt;&lt;input id="poleHeightOn" type="checkbox" checked&gt; 연통 지지대&lt;/label&gt;&lt;/fieldset&gt;
      &lt;div id="supportInfo" class="text-sm"&gt;&lt;/div&gt;
&lt;/section&gt;&lt;section class="rig-card rig-wide"&gt;&lt;h3&gt;스트링과 지면 팩&lt;/h3&gt;&lt;div id="stringLengths"&gt;&lt;/div&gt;&lt;details id="planToggle"&gt;&lt;summary class="font-bold cursor-pointer"&gt;평면도 · 위에서 보기 (지면 팩 위치와 분배각)&lt;/summary&gt;&lt;svg id="guyPlan" viewBox="0 0 430 220" style="width:100%;max-width:600px" role="img" aria-label="위에서 수직으로 내려다본 스트링과 지면 팩 위치"&gt;&lt;/svg&gt;&lt;p class="text-xs"&gt;난로나 연통을 좌우·앞뒤로 끌면 연통과 스트링 배치가 갱신됩니다. 엘보 연통은 끝의 ↻를 끌어 난로를 중심으로 회전합니다. 오른쪽은 0°, 아래쪽은 90°입니다. 수직 연통은 위에서 보면 같은 위치에 겹칩니다. 각도는 지면 평면에서 시계 방향으로 표시합니다.&lt;/p&gt;&lt;/details&gt;
      &lt;details class="rig-method"&gt;&lt;summary&gt;스트링 길이와 분배각 계산 기준&lt;/summary&gt;&lt;ul&gt;&lt;li&gt;세 팩은 지면에 놓고, 각 스트링은 철제 비너로 고정링에 연결합니다.&lt;/li&gt;&lt;li&gt;도면의 3차원 텐트 외피에서 20cm 이격되는 방향을 찾습니다. 팩의 수평 거리는 고정링 높이부터 탐색합니다.&lt;/li&gt;&lt;li&gt;5° 간격으로 후보를 비교해 120°에 가까운 분배와 세 줄의 총길이를 함께 고려합니다.&lt;/li&gt;&lt;li&gt;링에서 팩까지의 직선거리에 스토퍼 여유 1m를 더하고 0.1m 단위로 올림합니다. 지면 경사와 줄 처짐은 현장에서 확인하세요.&lt;/li&gt;&lt;/ul&gt;&lt;/details&gt;&lt;/section&gt;&lt;/div&gt;    &lt;/section&gt;

    function getActiveStove() {
      return STOVES.find((s) =&gt; s.id === st.stoveId) || STOVES[0];
    }

    function isFixed60or70Pipe(stoveObj, pipeSys) {
      return pipeSys === "single_70" || pipeSys === "ti_single_70_76" || Boolean(stoveObj &amp;&amp; stoveObj.isRollPipe);
    }

    function syncMaterialSelectors() {
      const stoveObj = getActiveStove();
      const isTi = stoveObj.mat === "titanium";
      const pipeEl = document.getElementById("sPipeSys");
      const protEl = document.getElementById("sProtSys");
      const protHintEl = document.getElementById("sProtCompatHint");
      const hintEl = document.getElementById("sPipeMatHint");
      const matBadge = document.getElementById("sMaterialBadge");

      if (matBadge) {
        if (isTi) {
          matBadge.textContent = "🪶 티타늄 전용";
          matBadge.className = "text-[10px] font-extrabold px-2 py-0.5 rounded-full bg-indigo-50 text-indigo-700 border border-indigo-200";
        } else {
          matBadge.textContent = "🔩 스텐 전용";
          matBadge.className = "text-[10px] font-extrabold px-2 py-0.5 rounded-full bg-slate-100 text-slate-700 border border-slate-200";
        }
      }
      if (hintEl) {
        hintEl.textContent = isTi ? "(티타늄 난로 → 티타늄 연통 전용)" : "(스테인리스 난로 → 스텐 연통 전용)";
        hintEl.className = isTi ? "text-[10px] font-bold text-indigo-600" : "text-[10px] font-bold text-slate-500";
      }

      if (pipeEl) {
        const opts = isTi
          ? [
              { v: "ti_nested_70_76", t: "티타늄 70-76파이 네스티드 세트" },
              { v: "ti_single_70_76", t: "티타늄 70파이 단품 조합 (고정 Ø70)" },
              { v: "ti_nested_83_89", t: "티타늄 83-89파이 대형 세트" }

              { v: "tapered_70_73_76", t: "캠핑투게더 3.3m 기본연통세트 · 총 12본" },

        if (!opts.some((o) =&gt; o.v === st.pipeSys)) st.pipeSys = opts[0].v;
        pipeEl.innerHTML = opts.map((o) =&gt; `&lt;option value="${o.v}"&gt;${o.t}&lt;/option&gt;`).join("");
        pipeEl.value = st.pipeSys;
      }

      const canUseTiGuard = isFixed60or70Pipe(stoveObj, st.pipeSys);
      if (protEl) {
        const pOpts = isTi
          ? [
              { v: "mesh_guard", t: "스텐 메쉬 보호망 50cm (Ø60~90mm 유연 호환)" },
              ...(canUseTiGuard ? [{ v: "ti_guard_70", t: "포몰리 티타늄 보호망 가변식 (고정 Ø60·70mm 전용)" }] : [])

            ];
        if (!pOpts.some((o) =&gt; o.v === st.protSys)) st.protSys = pOpts[0].v;
        protEl.innerHTML = pOpts.map((o) =&gt; `&lt;option value="${o.v}"&gt;${o.t}&lt;/option&gt;`).join("");
        protEl.value = st.protSys;

      }
    }

    function getTent() { return TENTS.find((t) =&gt; t.id === st.tentId) || TENTS[0]; }

    const bodySizes = new Map();
    function bodySize() { return bodySizes.get(st.stoveId) || {width:40, depth:40}; }
    function skinProfile(view) {
      const t=getTent(), half=(view==="front"?t.w:t.l)/2, h=st.tentH;
      if(t.shape==="tipi") return [[-half,0],[0,h],[half,0]];
      const shoulder=Math.min(.97, Math.max(.15, t.sw/t.h || .45));
      if(t.shape==="cabin") return [[-half,0],[-half,h*shoulder],[0,h],[half,h*shoulder],[half,0]];
      const flat=t.shape==="tunnel" &amp;&amp; view==="side" ? half*.73 : 0;
      const points=[];
      for(let i=0;i&lt;=64;i++) {
        const a=Math.PI*(1-i/64);
        points.push([(half-flat)*Math.cos(a)+(i&lt;=32?-flat:flat),h*Math.sin(a)]);
        if(i===32 &amp;&amp; flat) points.push([flat,h]);
      }
      return points;
    }
    function skinLimit(view,pts=view===st.view&amp;&amp;st.planDepth?activeProfile():skinProfile(view),halfBody=(view==="front"?bodySize().width:bodySize().depth)/2) {
      const top=Number(st.standH)+Number(st.stoveH);
      let limit=Infinity, centerGap=Infinity;
      const edges=[];
      for(let i=1;i&lt;pts.length;i++) {
        const [ax,ay]=pts[i-1], [bx,by]=pts[i];
        const len=Math.hypot(bx-ax,by-ay);
        if(!len) continue;
        const nx=(ay-by)/len, ny=(bx-ax)/len;
        const offset=nx*ax+ny*ay-Math.abs(nx)*halfBody-ny*top;
        edges.push({nx,ny,offset});
        centerGap=Math.min(centerGap,offset);
        if(Math.abs(nx)&gt;1e-8) limit=Math.min(limit,(offset-45)/Math.abs(nx));
      }
      return {limit:Math.max(0,limit), fits:centerGap&gt;=45,
        distance:x=&gt;Math.min(...edges.map(e=&gt;e.offset-e.nx*x)),
        nearest(x) {
          let best;
          for(const e of edges){
            const d=e.offset-e.nx*x;
            if(best &amp;&amp; best.d&lt;=d) continue;
            const bx=x+Math.sign(e.nx)*halfBody;
            best={d,bx,by:top,tx:bx+d*e.nx,ty:top+d*e.ny};

        }};

    function maxDepthLimit() {

        if(ny&lt;=1e-8||nz&lt;0)continue;
        max=Math.min(max,(bound-20-45-bodyProjection(nx,ny,nz))/ny);
      }
      return Math.max(0,max);
    }
    function clampDepth(value){
      const max=maxDepthLimit();
      return Math.sign(value||0)*Math.min(Math.abs(value||0),max);
    }
    function bodyProjection(nx,ny,nz){
      const b=bodySize(),front=st.view==="front";
      return Math.abs(nx)*(front?b.width:b.depth)/2+Math.abs(ny)*(front?b.depth:b.width)/2+nz*(Number(st.stoveH)+Number(st.standH));

    function activeProfile(){
      if(!st.planDepth)return skinProfile(st.view);
      const planes=skinHull({H_tent:st.tentH}).planes;
      let half=getSpan()/2;
      for(const [nx,ny,nz,bound] of planes)if(nx&gt;1e-8)half=Math.min(half,(bound-20-ny*st.planDepth)/nx);
      const pts=[];
      for(let i=0;i&lt;=96;i++){
        const x=half*(2*i/96-1);let h=st.tentH;

    function maxPosLimit() {

    function clampPos(x) {

    function clampJackForAngle(rawJackXCm, rawJackHCm) {
      const H_tent = Math.max(130, Math.min(350, Number(st.tentH) || 210));
      const H_start = (Number(st.stoveH) || 35) + (Number(st.standH) || 0);
      const rawFirst = st.path!=="straight" &amp;&amp; st.elbowStart==="outlet" ? 0 : (["mixed_70_75","single_75"].includes(st.pipeSys) ? 30 : 28);
      const halfSpan = Math.max(60, Math.round(getSpan() / 2 - 12));
      const maxJackH = Math.max(105, Math.round(H_tent));

      let jH = Math.round(Math.max(100, Math.min(maxJackH, rawJackHCm)));
      let jX = Math.round(Math.max(-halfSpan, Math.min(halfSpan, rawJackXCm)));

      if (st.path === "elbow45") {
        const minJackH45 = Math.min(maxJackH, Math.max(100, Math.round(H_start + rawFirst + 15)));
        jH = Math.max(minJackH45, jH);
        const maxD45 = Math.max(15, Math.round(jH - (H_start + rawFirst)));
        const dx = jX - st.stovePosCm;
        const sign = dx === 0 ? 1 : Math.sign(dx);
        const clampedD = Math.max(15, Math.min(maxD45, Math.abs(dx)));
        jX = Math.round(Math.max(-halfSpan, Math.min(halfSpan, st.stovePosCm + sign * clampedD)));
      } else if (st.path === "elbow90") {
        const minJackH90 = Math.min(maxJackH, Math.max(100, Math.round(H_start + rawFirst + 5)));
        jH = Math.max(minJackH90, jH);
        const dx = jX - st.stovePosCm;
        const sign = dx === 0 ? 1 : Math.sign(dx);
        const clampedD = Math.max(25, Math.min(130, Math.abs(dx)));
        jX = Math.round(Math.max(-halfSpan, Math.min(halfSpan, st.stovePosCm + sign * clampedD)));
      } else {

        const dx = jX - st.stovePosCm;
        if (Math.abs(dx) &gt; maxDAuto) {

    function resetPos() {

    const installationModes={
      straight:{diff:"하",resistance:"낮음",diffCls:"bg-emerald-50 border-emerald-200 text-emerald-700"},

    function baseline() {
      const stoveObj = getActiveStove();
      const H_tent = Math.max(130, Math.min(350, Number(st.tentH) || 210));
      const H_jack = Math.max(80, Math.min(350, Number(st.jackH) || 175));
      const H_stove = Math.max(20, Math.min(90, Number(st.stoveH) || 35));
      const H_stand = Math.max(0, Math.min(80, Number(st.standH) || 0));
      const H_start = H_stove + H_stand;
      const isTi3mSet = (stoveObj.id === "lumora_ti" || stoveObj.id === "dweller_ti3") &amp;&amp; st.pipeSys === "ti_nested_70_76";
      const isMstove33mSet = (stoveObj.id === "mstove_v3" || stoveObj.id === "mstove_v2_down") &amp;&amp; st.pipeSys === "tapered_70_73_76";
      const overlap = isTi3mSet ? 3 : 5;
      const clearance = SPARK_MIN_CLEARANCE_CM;
      const rawPipe = (isTi3mSet || st.pipeSys==="mixed_70_75") ? 30 : (st.pipeSys === "single_75" ? 32 : 33);
      const effPipe = rawPipe - overlap;
      const rawFirst = isTi3mSet ? 30 : (["mixed_70_75","single_75"].includes(st.pipeSys) ? 30 : 28);
      const span = getSpan();
      const pos = clampPos(st.stovePosCm);
      const jackXCm = st.path==="straight"?pos:Math.round(st.jackPosCm);
      const D_horiz = Math.abs(jackXCm - pos);
      const activeSkin=skinLimit(st.view), otherSkin=skinLimit(st.view==="front"?"side":"front");
      let minWall=Math.min(activeSkin.distance(pos),otherSkin.distance(st.planDepth));
      if(st.planDepth)for(const [nx,ny,nz,bound] of skinHull({H_tent}).planes){
        if(nz&gt;=0)minWall=Math.min(minWall,bound-20-nx*pos-ny*st.planDepth-bodyProjection(nx,ny,nz));
      }
      const noFit=!activeSkin.fits || !otherSkin.fits;

      const effMode=st.path;
      const minTop = Math.max(H_tent + clearance, H_jack + 70);
      let elbowCnt = 0, elbowAng = 0, inVert = 0, midLen = 0, outVert = 0, reqEff = 0;

      if (effMode === "straight") {
        reqEff = Math.max(60, minTop - H_start);
        inVert = Math.max(0, H_jack - H_start);
        outVert = Math.max(0, reqEff - inVert);
      } else if (effMode === "elbow45") {
        elbowCnt = 2; elbowAng = 45;
        const diagRise = Math.max(15, Math.min(D_horiz, Math.max(15, H_jack - (H_start + rawFirst))));
        const e1 = Math.max(H_start + rawFirst, H_jack - diagRise);
        inVert = Math.max(rawFirst, e1 - H_start);
        const rise = Math.max(15, H_jack - (H_start + inVert));
        midLen = Math.round(Math.sqrt(D_horiz * D_horiz + rise * rise));
        outVert = Math.max(60, minTop - H_jack);
        reqEff = inVert + midLen + outVert;
      } else {
        elbowCnt = 2; elbowAng = 90;
        inVert = Math.max(rawFirst, H_jack - H_start);
        midLen = D_horiz + 35;
        outVert = Math.max(80, minTop - H_jack);
        reqEff = inVert + midLen + outVert;
      }

      const elbowEff = elbowCnt * (17 - overlap);
      const reqStraightCnt = Math.max(2, Math.ceil(Math.max(0, reqEff - rawFirst - elbowEff) / effPipe));
      const isTapered70Base = st.pipeSys === "tapered_70_73_76" || st.pipeSys === "ti_nested_70_76";
      let pipe70Count = 5;
      let extra70ForElbow = 0;
      if (elbowCnt &gt; 0 &amp;&amp; isTapered70Base) {

        const req70Total = 1 + straightToElbow2;
        pipe70Count = Math.max(5, req70Total);

      const defaultIncludedStraight = (isTi3mSet || isMstove33mSet) ? Math.max(2, (stoveObj.includedPipes || 0) - 1) : 2;
      const minStraightForTapered = (elbowCnt &gt; 0 &amp;&amp; isTapered70Base) ? Math.max(2, pipe70Count + 1) : 2;
      const baseStraightCnt = Math.max(reqStraightCnt, defaultIncludedStraight, minStraightForTapered);

      const baseRawTotal = rawFirst + baseStraightCnt * rawPipe + elbowCnt * 17;

      const roofClr = topH - H_tent;
      const sparkSafe = roofClr &gt;= SPARK_MIN_CLEARANCE_CM;

      const warns = [];
      let blocked = noFit;
      if (["double_pipe","both_guard"].includes(st.protSys) &amp;&amp; H_jack - H_start &lt; 50 &amp;&amp; effMode==="straight") {

      }
      if (H_jack &gt; H_tent || (H_jack === H_tent &amp;&amp; Math.hypot(jackXCm,st.planDepth)&gt;0.01)) {
        blocked = true;
        warns.push(`[입력 오류] 홀잭 높이(${H_jack}cm)가 텐트 최고 높이(${H_tent}cm)를 넘을 수 없습니다. 최고 높이와 같은 경우 통과구를 텐트 중앙에 배치하세요.`);

    function pipeSizes() {
      switch (st.pipeSys) {
        case "mixed_70_75": return [70, 75];
        case "tapered_70_73_76": return [70, 73, 76];
        case "ti_nested_70_76": return [70, 76];
        case "single_70":
        case "ti_single_70_76": return [70];
        default: return [];

    }

    function insertManualPipes(parts, sizes, step) {
      for (const d of sizes) {
        const index = parts.findIndex(p =&gt; (p.label.includes("리듀서") &amp;&amp; p.diameter&gt;d) || p.label.includes("불티캡"));
        const added = Array.from({length:st.added[d]},()=&gt;({label:"Ø"+d,diameter:d,dx:0,dy:step,type:"pipe",source:"추가"}));
        parts.splice(index&lt;0?parts.length:index,0,...added);
      }
    }

    function computePipeRun() {
      const sim = baseline();
      const sizes = pipeSizes();
      if (!sizes.length) {
        if (sim.elbowCnt) {
          sim.incompatibleElbow=true; sim.blocked = true;
          sim.warns.push("이 규격에는 Ø70 엘보를 연결할 수 없습니다. 수직 배출 또는 Ø70 호환 규격을 선택하세요.");

      }
      const parts = [];
      const manual = st.added;
      const tapered = sizes.length &gt; 1;
      const base = tapered ? (sizes.includes(73) ? 12 : 11) : Math.max(2, getActiveStove().includedPipes || 2);
      const first = sim.rawFirst, step = sim.effPipe;
      const angle = sim.elbowAng;
      const leg = angle ? elbowLegs[angle] : 0;
      const run = angle === 45 ? Math.SQRT1_2 : 1;
      const rise = angle === 45 ? Math.SQRT1_2 : 0;
      const sign = sim.jackXCm &gt;= sim.pos ? 1 : -1;
      const jackDistance = sim.D_horiz;
      const bendX=leg*run, bendY=leg*(1+rise);
      const toJack = Math.max(0, jackDistance - bendX);
      const movable=angle &amp;&amp; ["double_pipe","both_guard"].includes(st.protSys);
      const manualStage=movable &amp;&amp; st.elbowStart==="drag";
      const startSteps=manualStage?st.wallSteps:Math.max(0,Math.round((sim.H_jack-sim.H_start-bendY-toJack*rise/run)/step));
      const direct=angle &amp;&amp; (manualStage?startSteps===0:st.path!=="straight" &amp;&amp; (st.elbowStart==="outlet" || startSteps===0));
      const below = manualStage?Math.max(0,startSteps-1):angle &amp;&amp; !direct ? Math.max(0, Math.round((sim.H_jack - sim.H_start - first - (st.pipeSys==="mixed_70_75" &amp;&amp; st.mixedDamper?step:0) - bendY - toJack * rise / run) / step)) : 0;
      const meshSelected=["mesh_guard","both_guard","ti_guard_70"].includes(st.protSys);
      const inlineElbow=angle &amp;&amp; ["double_pipe","both_guard"].includes(st.protSys);
      const inlineSpan=inlineElbow?(50-sim.overlap)*run:0;
      const meshCount=meshSelected &amp;&amp; !inlineElbow?Math.ceil(50/step):0;
      const holeCount=Math.max(0,Math.ceil((toJack-inlineSpan)/(step*run)));
      const edge=angle&amp;&amp;st.bearing!=null?(sign&gt;0?routeProfile().at(-1)[0]:-routeProfile()[0][0]):sim.span/2;
      const footCount=Math.max(0,Math.ceil((edge+12-sign*sim.pos-2*bendX-inlineSpan)/(step*run)));
      const between=angle?Math.max(meshCount,inlineElbow?0:1,holeCount,footCount):0;
      const needed70 = below + between;
      const mixed = st.pipeSys === "mixed_70_75";
      const base70 = mixed ? 0 : tapered ? 4 : Math.max(0,base-2);
      const reserve=angle &amp;&amp; (inlineElbow||!sizes.includes(73))?1:0;
      const auto70=Math.max(0,needed70+reserve-base70);
      const total70 = base70 + auto70;
      let x = sim.pos, y = sim.H_start;
      function put(label, diameter, dx, dy, type="pipe", source=mixed?"포몰리 호환 구성":"기본 구성") {
        const part = {label,diameter,x,y,dx,dy,type,source};
        x += dx; y += dy; parts.push(part);
      }
      function straight(d, source, dx=0, dy=step) { put("Ø"+d, d, dx, dy, "pipe", source); }
      if(mixed &amp;&amp; st.mixedDamper) put("Ø70 댐퍼 연통",70,0,30,"damper","선택 부속");
      if(mixed &amp;&amp; angle &amp;&amp; !direct) straight(70,"엘보용 추가",0,st.mixedDamper?step:first);
      if(!mixed &amp;&amp; !direct) put(getActiveStove().mat === "titanium" &amp;&amp; tapered ? "Ø70" : "Ø70 댐퍼 연통",70,0,first);
      let used70 = 0;
      function lower(dx,dy) {
        used70++;
        const reserved=inlineElbow &amp;&amp; tapered;
        const fromSet=reserved &amp;&amp; needed70&gt;=base70 ? used70&lt;base70 || used70===needed70+1 : used70&lt;=base70;
        straight(70,fromSet?(mixed?"포몰리 호환 구성":"기본 구성"):"엘보용 추가",dx,dy);
      }
      let crossing = sim.H_jack;
      if (angle) {
        for (let i=0;i&lt;below;i++) lower(0,step);
        put(angle+"° 엘보 ①",70,sign*bendX,bendY,"elbow");
        crossing = y + toJack * rise/run;
        for (let i=0;i&lt;between;i++) lower(sign*step*run,step*rise);
        put(angle+"° 엘보 ②",70,sign*bendX,bendY,"elbow");
      }
      while (used70 &lt; total70) lower(0,step);
      const upper = sizes[sizes.length-1];
      if (sizes.includes(73)) {
        put("70→73 리듀서",73,0,step);
        for (let i=0;i&lt;4;i++) straight(73,"기본 구성");
        put("73→76 리듀서",76,0,step);
      } else if (mixed) {
        put("70→75 리듀서",75,0,30-sim.overlap);
      } else if (tapered) {
        put("70→76 리듀서",76,0,step);
        for(let i=0;i&lt;4;i++) straight(76,"기본 구성");
      }
      const topExtra=0;
      const doubleCap=st.doubleSpark &amp;&amp; upper===76 &amp;&amp; getActiveStove().mat==="stainless";
      if(doubleCap || (mixed &amp;&amp; st.mixedCap==="double")){
        put("Ø75 스텐 이중 불티캡",75,0,DOUBLE_CAP_LENGTH_CM-sim.overlap,"doubleCap",mixed?"혼합 구성":"교체 옵션");

      }else if(!mixed || st.mixedCap==="standard") put(mixed?"Ø75 기본 불티캡":"Ø"+upper+" 불티캡",upper,0,step);
      if (!mixed || !st.mixedAuto) insertManualPipes(parts, sizes, step);
      if(mixed &amp;&amp; parts[0].type==="pipe") parts[0].dy=30;
      x=sim.pos; y=sim.H_start;
      for(const p of parts){p.x=x; p.y=y; x+=p.dx; y+=p.dy;}
      const totalSeg=parts.filter(p=&gt;p.type!=="elbow").length;
      const manualTotal=sizes.reduce((n,d)=&gt;n+manual[d],0);
      const gap = angle ? crossing-sim.H_jack : 0;
      const warns=sim.warns.filter(m=&gt;!m.includes("불티 손상 주의"));
      if(angle &amp;&amp; (Math.abs(gap)&gt;0.05 || jackDistance&lt;bendX)) {
        warns.push(`홀잭 실측 위치와 대조하세요. 입력 중심 ${sim.H_jack}cm · 직관 조립 경로 ${crossing.toFixed(1)}cm${jackDistance&lt;bendX?" (홀잭이 첫 엘보 범위에 있음)":""}. ${direct?"1단 직결 경로입니다. 통과 높이가 맞지 않으면 첫 엘보 위치에서 ‘자동 · 홀잭 높이에 맞춤’을 선택하거나 이중연통 위치를 조정하세요.":"도면은 부품 길이를 유지합니다."}`);
      }
      return {...sim,lowerStages:angle?(direct?0:1+below):0,direct,parts,warns,auto70,topExtra,upper,base,crossing,gap,leg,
        extra70ForElbow:auto70,actualExtraPipes:manualTotal,extraOutCm:manualTotal*step,
        totalSeg,straightCnt:totalSeg-(direct?0:1),topH:Math.round(y*10)/10,roofClr:Math.round((y-sim.H_tent)*10)/10,
        sparkSafe:y&gt;=sim.H_tent+SPARK_MIN_CLEARANCE_CM};
    }

    function pipeAxis(){
      const sign=Math.round(st.jackPosCm)&gt;=st.stovePosCm?1:-1;
      const angle=st.bearing==null||st.path==="straight"?0:st.bearing-(sign&lt;0?180:0);
      const rad=angle*Math.PI/180;
      return {angle,c:Math.cos(rad),s:Math.sin(rad)};
    }
    function planPoint(x){
      const a=pipeAxis(),delta=x-st.stovePosCm;
      return [st.stovePosCm+delta*a.c,st.planDepth+delta*a.s];
    }
    function routeProfile(){
      if(!pipeAxis().angle)return activeProfile();
      const a=pipeAxis(),planes=skinHull({H_tent:st.tentH}).planes;
      let low=-Infinity,high=Infinity;
      for(const [nx,ny,nz,b] of planes){
        const k=nx*a.c+ny*a.s,available=b-20-nx*st.stovePosCm-ny*st.planDepth;
        if(k&gt;1e-8)high=Math.min(high,available/k);
        if(k&lt; -1e-8)low=Math.max(low,available/k);
      }
      const pts=[];
      for(let i=0;i&lt;=96;i++){
        const d=low+(high-low)*i/96,x=st.stovePosCm+d;
        const [px,py]=planPoint(x);let h=st.tentH;
        for(const [nx,ny,nz,b] of planes)if(nz&gt;1e-8)h=Math.min(h,(b-20-nx*px-ny*py)/nz);
        pts.push([x,Math.max(0,h)]);
      }
      return [[pts[0][0],0],...pts,[pts.at(-1)[0],0]];
    }
    function skinCrossing(x,y,ux,uy,maxLength){
      let nearest=Infinity;
      const vertices=routeProfile();
      for(let i=1;i&lt;vertices.length;i++){
        const [ax,ay]=vertices[i-1], [bx,by]=vertices[i];
        const dx=bx-ax,dy=by-ay,det=ux*dy-uy*dx;
        if(Math.abs(det)&lt;1e-9)continue;
        const t=((ax-x)*dy-(ay-y)*dx)/det, u=((ax-x)*uy-(ay-y)*ux)/det;
        if(t&gt;=-1e-6 &amp;&amp; t&lt;=maxLength+1e-6 &amp;&amp; u&gt;=-1e-6 &amp;&amp; u&lt;=1+1e-6)nearest=Math.min(nearest,Math.max(0,t));

    }
    function compute() {
      const sim=computePipeRun();
      if(sim.incompatibleElbow) return sim;
      const inline=["double_pipe","both_guard"].includes(st.protSys);
      const mesh=["mesh_guard","both_guard","ti_guard_70"].includes(st.protSys);
      const diameter=st.pipeSys==="single_75"?75:70;
      if(!sim.parts &amp;&amp; diameter===75 &amp;&amp; sim.effMode==="straight") {
        sim.parts=Array.from({length:sim.totalSeg},(_,i)=&gt;({
          x:sim.pos,y:sim.H_start+(i?sim.rawFirst+(i-1)*sim.effPipe:0),dx:0,dy:i?sim.effPipe:sim.rawFirst,
          label:i===0?"70→75 리듀서":i===sim.totalSeg-1?"Ø75 불티캡":"Ø75", diameter:75,type:"pipe",source:"기본 구성"}));
      }
      if(!sim.parts &amp;&amp; st.pipeSys==="ti_nested_83_89" &amp;&amp; !sim.elbowCnt){
        sim.parts=Array.from({length:sim.totalSeg},(_,i)=&gt;{
          const d=i&lt;Math.ceil(sim.totalSeg/2)?83:89;
          return {x:sim.pos,y:sim.H_start+(i?sim.rawFirst+(i-1)*sim.effPipe:0),dx:0,dy:i?sim.effPipe:sim.rawFirst,
          type:"pipe",label:"Ti Ø"+d+(i===sim.totalSeg-1?" 불티캡":""),diameter:d,source:"기본 구성"};
        });
      }
      if(!sim.parts) return sim;
      const parts=sim.parts, tx=sim.jackXCm, ty=sim.H_jack;
      function assignOrigins(){
        let x=sim.pos,y=sim.H_start;
        for(const p of parts){p.x=x;p.y=y;x+=p.dx;y+=p.dy;}
        return y;
      }
      const elbows=parts.filter(p=&gt;p.type==="elbow");
      const effective=50-sim.overlap;
      let shell;
      if(inline) {
        const ux=elbows.length ? Math.sign(elbows[0].dx)*(sim.elbowAng===45?Math.SQRT1_2:1):0;
        const uy=elbows.length ? (sim.elbowAng===45?Math.SQRT1_2:0):1;
        const firstReducer=parts.findIndex((p,i)=&gt;(i&gt;0 || st.pipeSys==="mixed_70_75") &amp;&amp; (p.label.includes("리듀서") || p.label.includes("불티캡")));
        const mixedRun=st.pipeSys==="mixed_70_75";
        if(!elbows.length &amp;&amp; firstReducer&gt;=0 &amp;&amp; (!mixedRun || st.mixedAuto) &amp;&amp;
           (parts[firstReducer-1]?.diameter===diameter || (mixedRun &amp;&amp; firstReducer===0))){
          const joint=parts[firstReducer];
          const count=Math.max(firstReducer===0?1:0,Math.ceil((ty-joint.y-effective-(firstReducer===0?sim.overlap:0))/sim.effPipe));
          sim.wallExtra=count; sim.straightCnt+=count;
          const extension=Array.from({length:count},()=&gt;({dx:0,dy:sim.effPipe,diameter,label:"Ø"+diameter,type:"pipe",source:"홀잭 위치용 추가"}));
          if(firstReducer===0){extension[0].dy=30;joint.dy=sim.effPipe;}
          parts.splice(firstReducer,0,...extension);
          assignOrigins();
        }
        const firstBend=parts.indexOf(elbows[0]),lastBend=parts.indexOf(elbows[1]);
        if(elbows.length){
          const inlet=parts[firstBend+1],end=parts[lastBend];
          sim.skinHit=skinCrossing(inlet.x,inlet.y,ux,uy,Math.hypot(end.x-inlet.x,end.y-inlet.y)+effective);
        }
        const aim=sim.skinHit||{x:tx,y:ty};
        let best=-1,score=Infinity;
        for(let i=1;i&lt;parts.length;i++){
          const prev=parts[i-1], next=parts[i];
          if(prev.diameter!==diameter || (next.diameter!==diameter &amp;&amp; !next.label.startsWith(diameter+"→"))) continue;
          if(elbows.length &amp;&amp; (i&lt;=firstBend || i&gt;lastBend))continue;
          if(elbows.length &amp;&amp; st.wallMount==="first" &amp;&amp; i!==firstBend+1)continue;
          if(mesh &amp;&amp; diameter!==70 &amp;&amp; elbows.length &amp;&amp; Math.max(i-parts.indexOf(elbows[0])-1,parts.indexOf(elbows[1])-i)*sim.effPipe&lt;50)continue;

        }
        if(best&lt;0){sim.blocked=true;sim.warns.push(mixedRun &amp;&amp; !st.mixedAuto?"이중연통을 연결하려면 Ø70 직관을 추가하거나 자동 배정을 선택하세요.":"홀잭 구간에 이중연통을 연결할 같은 구경의 마디가 없습니다.");return sim;}

        parts.splice(best,0,shell);
        sim.topH=Math.round(assignOrigins()*10)/10;
        sim.roofClr=Math.round((sim.topH-sim.H_tent)*10)/10;
        sim.sparkSafe=sim.roofClr&gt;=SPARK_MIN_CLEARANCE_CM;
        sim.totalSeg=parts.filter(p=&gt;p.type!=="elbow").length;
        sim.inlinePipe=shell;
        if(elbows.length){
          if(!sim.skinHit)sim.warns.push("두 엘보 사이 연통이 도면의 텐트 스킨을 통과하지 않습니다. 난로 또는 첫 엘보 위치를 조정하세요.");
          else {
            sim.skinOffset=Math.hypot(shell.x+shell.dx/2-aim.x,shell.y+shell.dy/2-aim.y);
            if(sim.skinOffset&gt;effective/2+.01)sim.warns.push("도면의 스킨 통과점이 이중연통 구간 밖입니다. 첫 엘보 위치와 홀잭 입력값을 확인하세요.");
          }
        }
      }
      function extendToHeight(){
        const cap=parts.at(-1);
        const assembled=cap.y+cap.dy, target=sim.H_tent+SPARK_MIN_CLEARANCE_CM;
        const upperStep=sim.effPipe;
        sim.topExtra=Math.max(0,Math.ceil((target-assembled-1e-8)/upperStep));
        sim.beforeExtension=assembled;
        const makeExtension=(d,n)=&gt;Array.from({length:n},()=&gt;({dx:0,dy:upperStep,diameter:d,label:"Ø"+d,type:"pipe",source:"높이 맞춤 추가"}));
        let add70=0;
        if(st.pipeSys==="mixed_70_75"){
          const count=d=&gt;parts.filter(p=&gt;p.label==="Ø"+d).length;
          add70=Math.max(0,Math.min(sim.topExtra,Math.ceil((count(75)+sim.topExtra-count(70))/2)));
          const reducerIndex=parts.findIndex(p=&gt;p.label==="70→75 리듀서");
          const lowerExtension=makeExtension(70,add70);
          if(reducerIndex===0 &amp;&amp; add70){lowerExtension[0].dy=30;parts[0].dy=upperStep;}
          parts.splice(reducerIndex,0,...lowerExtension);

        }
        parts.splice(parts.length-(cap.label.includes("불티캡")?1:0),0,...makeExtension(sim.upper,sim.topExtra-add70));
        if(st.pipeSys==="mixed_70_75" &amp;&amp; st.mixedAuto){
          const originalFirst=parts[0];
          insertManualPipes(parts,[70,75],upperStep);
          if(parts[0]!==originalFirst){
            parts[0].dy=originalFirst.dy;
            originalFirst.dy=upperStep;
          }
          sim.totalSeg+=sim.actualExtraPipes;
          sim.straightCnt+=sim.actualExtraPipes;
          sim.packing.lower+=st.added[70];
          sim.packing.upper+=st.added[75];
        }
        const top=assignOrigins();
        sim.topH=Math.round(top*10)/10;sim.roofClr=Math.round((top-sim.H_tent)*10)/10;

        sim.totalSeg+=sim.topExtra;sim.straightCnt+=sim.topExtra;
      }
      if(st.pipeSys==="mixed_70_75"){
        if(st.mixedAuto) extendToHeight();
        else sim.packing={lower:parts.filter(p=&gt;p.label==="Ø70").length,upper:parts.filter(p=&gt;p.label==="Ø75").length};
      }
      if(mesh &amp;&amp; shell?.diameter===70) {
        sim.meshAnchor={x:shell.x+shell.dx/2, y:shell.y+shell.dy/2,
          ang:Math.atan2(shell.dx,shell.dy)*180/Math.PI};
        sim.meshOnWall=true;
      } else if(mesh) {
        let anchor,score=Infinity;
        {
          const low=elbows.length ? parts.indexOf(elbows[0])+1 : 1;
          const high=elbows.length ? parts.indexOf(elbows[1]) : parts.length-(parts.at(-1).label.includes("불티캡")?1:0);
          const runs=[];
          for(const p of parts.slice(low,high)){
            if(p.type!=="pipe" || p.diameter&lt;60 || p.diameter&gt;90 ||
               (st.protSys==="ti_guard_70" &amp;&amp; ![60,70].includes(p.diameter))){runs.push(null);continue;}
            const len=Math.hypot(p.dx,p.dy),ux=p.dx/len,uy=p.dy/len,last=runs.at(-1);

          let offset=0,autoPos=0,selected=rigState.mesh===null?null:travel*rigState.mesh/100;
          for(let i=0;i&lt;ranges.length;i++){

        jackPt = { x: jx - dir * 5, y: jY + 5, ang: dir * 45 };
      } else {
        const outDir = jx &gt;= cx ? 1 : -1;
        const outX = Math.min(638, Math.max(152, jx + outDir * Math.max(24, Math.round(35 * scaleX))));
        pts = [{ x: sx, y: stTopY }, { x: sx, y: jY }, { x: outX, y: jY }, { x: outX, y: topY }];
        jackPt = { x: jx, y: jY, ang: 90 }; topPt = { x: outX, y: topY };
      }

      if (sim.parts) {
        const tail = sim.parts[sim.parts.length-1];
        topPt = {x:cx+(tail.x+tail.dx)*scaleX,y:topY};
        jackPt = {x:jx,y:jY,ang:sim.elbowAng===90 ? 90 : sim.elbowAng*Math.sign(sim.jackXCm-sim.pos)};
      }
      const edges = [];
      let totalPx = 0;
      for (let i = 0; i &lt; pts.length - 1; i++) {
        const dx = pts[i + 1].x - pts[i].x, dy = pts[i + 1].y - pts[i].y, len = Math.hypot(dx, dy);
        edges.push({ dx, dy, len, s: totalPx, e: totalPx + len, p0: pts[i], p1: pts[i + 1] });
        totalPx += len;
      }
      const sample = (d) =&gt; {
        const dd = Math.max(0, Math.min(totalPx, d));
        for (let i = 0; i &lt; edges.length; i++) {
          const g = edges[i];
          if (dd &lt;= g.e || i === edges.length - 1) {
            const tVal = g.len &gt; 0 ? (dd - g.s) / g.len : 0;
            const ux = g.len &gt; 0 ? g.dx / g.len : 0, uy = g.len &gt; 0 ? g.dy / g.len : -1;
            return { x: g.p0.x + g.dx * tVal, y: g.p0.y + g.dy * tVal, ux, uy, nx: -uy, ny: ux };
          }
        }
        return { x: sx, y: stTopY, ux: 0, uy: -1, nx: 1, ny: 0 };
      };
      const subPoly = (d0, d1) =&gt; {
        const arr = [];
        const a = sample(d0); arr.push(`${a.x.toFixed(1)},${a.y.toFixed(1)}`);
        for (let i = 0; i &lt; edges.length - 1; i++) {
          if (edges[i].e &gt; d0 + 0.5 &amp;&amp; edges[i].e &lt; d1 - 0.5) arr.push(`${edges[i].p1.x.toFixed(1)},${edges[i].p1.y.toFixed(1)}`);
        }
        const b = sample(d1); arr.push(`${b.x.toFixed(1)},${b.y.toFixed(1)}`);
        return arr.join(" ");
      };

      const placedBoxes = [];
      const overlapsAny = (x, y, w, h) =&gt; placedBoxes.some((b) =&gt; !(x + w + 4 &lt; b.x || x &gt; b.x + b.w + 4 || y + h + 3 &lt; b.y || y &gt; b.y + b.h + 3));
      const reserveBox = (x, y, w, h) =&gt; { placedBoxes.push({ x, y, w, h }); };

      const sparkMinY = yOf(sim.H_tent + SPARK_MIN_CLEARANCE_CM);
      const sparkLineCol = sim.sparkSafe ? "#059669" : "#e11d48";
      const sparkBoxW = mobile ? 114 : 94, sparkBoxH = mobile ? 36 : 31;
      const sparkBoxX=Math.max(148,Math.min(225,topPt.x-22-sparkBoxW));
      const sparkBoxY = sparkMinY + 0.6;
      reserveBox(sparkBoxX, sparkBoxY, sparkBoxW, sparkBoxH);

      const dimFont = mobile ? 13 : 10;
      const charW = mobile ? 7.8 : 6;
      const pillH = mobile ? 22 : 16;
      const heightLabel = (value, signed = false) =&gt; {
        const rounded = Math.round(value);
        const positive = signed &amp;&amp; rounded &gt; 0;
        const valueText = rounded + " cm";
        const text = (positive ? "+ " : "") + valueText;
        const markup = positive ? '&lt;tspan fill="#dc2626"&gt;+&lt;/tspan&gt; ' + valueText : valueText;
        const textWidth = text.length * charW;
        return { text, markup, textWidth, width: textWidth + (mobile ? 12 : 8) };
      };
      const tentLabel = heightLabel(sim.H_tent);
      const roofLabel = heightLabel(sim.roofClr, true);
      const totalLabel = heightLabel(sim.topH);
      const lDim = 211;
      const tentDimMidY = (gY + py) / 2;
      reserveBox(lDim - tentLabel.width/2, tentDimMidY - pillH/2, tentLabel.width, pillH);

      const roofDimX = topY &gt; py ? 156 : lDim;
      const roofLabelX = roofDimX - roofLabel.width / 2;
      const roofMidY = (py + topY) / 2;
      reserveBox(roofLabelX, roofMidY - pillH/2, roofLabel.width, pillH);

      const rDim = mobile ? 108 : 101;
      const totalDimMidY = (gY + topY) / 2;
      reserveBox(rDim-totalLabel.width/2, totalDimMidY - pillH/2, totalLabel.width, pillH);

      let pipesHtml = "";
      let ticksHtml = "", labelsHtml = "";
      const totalW = Math.max(1, sim.rawFirst + sim.straightCnt * sim.effPipe);
      const safeTotalPx = Math.max(1, totalPx);
      const pipeNames = [];
      let accW = 0;

      const pipeBounds = [];
      if (sim.parts) {
        pipesHtml = "";
        let order=0;
        for (const part of sim.parts) {
          const elbow=part.type==="elbow";
          const x1=cx+part.x*scaleX, y1=gY-part.y*scaleY;
          const dx=part.dx*scaleX, dy=-part.dy*scaleY;
          const x2=x1+dx, y2=y1+dy;
          const firstBend=part.label.endsWith("①");
          let path = `M ${x1} ${y1} L ${x2} ${y2}`;
          if(elbow) {
            const kx=firstBend ? x1 : x2;
            const ky=firstBend ? y1-sim.leg*scaleY : y2+sim.leg*scaleY;
            path=`M ${x1} ${y1} L ${kx} ${ky} L ${x2} ${y2}`;
          }
          const color=elbow?"#344054":diameterColor[part.diameter];
          const name=elbow?"Ø70 "+part.label:part.label.replace(/^(\d+)→(\d+)/,"Ø$1 → Ø$2");
          const desc=name+" · "+part.source;
          const w=part.diameter/10*scaleX;
          const reducer=part.label.match(/^(\d+)→/);
          const cornerY = elbow ? (firstBend ? y1 - sim.leg * scaleY : y2 + sim.leg * scaleY) : y1;
          const outsideWidth = part.type === "doubleWall" ? (part.diameter === 75 ? 12 : 10) * scaleX : w;
          const margin = outsideWidth / 2 + 3;
          const ymin = Math.min(y1, y2, cornerY), ymax = Math.max(y1, y2, cornerY);
          pipeBounds.push({x: Math.min(x1,x2)-margin, y: ymin-margin,
            w: Math.abs(dx)+2*margin, h: ymax-ymin+2*margin});
          if(part.type==="damper"){
            const handleY=(y1+y2)/2;
            pipesHtml+=`&lt;g&gt;&lt;title&gt;${desc}&lt;/title&gt;&lt;path d="${path}" stroke="${color}" stroke-width="${w}"/&gt;&lt;path d="M ${x1} ${handleY} h ${w/2+4}" stroke="#334155" stroke-width="1.4"/&gt;&lt;circle cx="${x1+w/2+4}" cy="${handleY}" r="1.8" fill="#182432"/&gt;&lt;/g&gt;`;
          } else if(part.type==="doubleWall") {
            const length=Math.hypot(dx,dy), outer=(part.diameter===75?12:10)*scaleX;
            const angle=Math.atan2(dx,-dy)*180/Math.PI;
            pipesHtml+=`&lt;g class="guard-wall" transform="translate(${x1},${y1}) rotate(${angle})"&gt;&lt;title&gt;${desc}&lt;/title&gt;
              &lt;rect x="${-outer/2}" y="${-length}" width="${outer}" height="${length}" fill="url(#steelShell)" stroke="#475569" stroke-width=".65"/&gt;
              &lt;path d="M ${-outer/2} 0 h ${outer} M ${-outer/2} ${-length} h ${outer}" stroke="#334155" stroke-width="1.4"/&gt;&lt;/g&gt;`;
          } else if(part.type==="doubleCap"){
          } else if(part.label.includes("불티캡")){
            pipesHtml+=standardCapShape(x1,y1,dx,dy,w);
          } else if(reducer) {
            pipesHtml+=reducerShape(x1,y1,x2,y2,Number(reducer[1]),part.diameter,scaleX);
          } else {
            pipesHtml+=`&lt;path d="${path}" stroke="${color}" stroke-width="${w}" stroke-linejoin="miter" stroke-linecap="butt" fill="none"&gt;&lt;title&gt;${desc}&lt;/title&gt;&lt;/path&gt;`;
          }
          const norm=Math.hypot(dx,dy)||1;
          const side=elbow ? (firstBend ? 1 : sim.elbowAng===45 ? Math.SQRT1_2 : 0) : -dy/norm;
          const up=elbow ? (firstBend ? 0 : Math.sign(dx)*(sim.elbowAng===45 ? Math.SQRT1_2 : 1)) : dx/norm;
          const radius=(reducer?Number(reducer[1])/10*scaleX:w)/2;
          const line=`x1="${x1-side*radius}" y1="${y1-up*radius}" x2="${x1+side*radius}" y2="${y1+up*radius}"`;
          ticksHtml+=`&lt;g class="pipe-joint"&gt;&lt;line ${line} stroke="#fff" stroke-width="2.7"/&gt;&lt;line ${line} stroke="#182432" stroke-width="1.2"/&gt;&lt;/g&gt;`;
          pipeNames.push(desc);
          order++;
          if(st.showNode) {
            const label=part.type==="doubleWall"?order+"단　◆":order+"단　"+name+(part.type==="doubleCap" &amp;&amp; st.pipeSys!=="mixed_70_75"?" (교체)":["기본 구성","포몰리 호환 구성","혼합 구성"].includes(part.source)?"":" (추가)");
            const mx=(x1+x2)/2,my=(y1+y2)/2;
            const nodeFont=mobile?11.2:9;
            const boxH=mobile?17:15;
            const boxTopOff=mobile?13:11;
            const minXBound=mobile?vb.x+6:52;
            const maxXBound=mobile?vb.x+vb.w-6:800;
            const width=Array.from(label).reduce((w,c)=&gt;w+(c.charCodeAt(0)&gt;255?(mobile?11.5:9.5):(mobile?7.6:6.3)),mobile?10:8);
            const preferred=pipeNames.length%2?-1:1;
            let chosen;
            const offsets=mobile?[0,-16,16,-32,32,-48,48]:[0,-14,14,-28,28,-42,42];
            for(const dy of offsets){
              for(const side of [preferred,-preferred]){
                const lx=mx+side*(elbow?56:(mobile?20:22)),left=side&lt;0?lx-width:lx,baseline=my+dy;

            }
            if(!chosen){
              const left=Math.max(minXBound,Math.min(maxXBound-width,mx+20));
              const baseline=Math.abs(my-sparkMinY)&lt;25?sparkMinY+25:my;
              chosen={lx:left,left,baseline,side:1};
            }
            const {lx,left,baseline,side}=chosen;
            reserveBox(left,baseline-boxTopOff,width,boxH);
            if(Math.abs(baseline-my)&gt;4)labelsHtml+=`&lt;line x1="${mx}" y1="${my}" x2="${lx}" y2="${baseline-3}" stroke="#81909e" stroke-width=".8"/&gt;`;
            labelsHtml+=`&lt;text x="${lx}" y="${baseline}" text-anchor="${side&lt;0?"end":"start"}" font-size="${nodeFont}" font-weight="${mobile?"700":"600"}" fill="#1e293b" stroke="white" stroke-width="${mobile?"3":"2.5"}" paint-order="stroke"&gt;${label}&lt;/text&gt;`;
          }
        }
      } else for (let i = 0; i &lt; sim.totalSeg; i++) {
        const w = i === 0 ? sim.rawFirst : sim.effPipe;
        const d0 = (accW / totalW) * safeTotalPx;
        accW += w;
        const d1 = (accW / totalW) * safeTotalPx;
        const isTopCap = i === sim.totalSeg - 1;
        const isExtraAdded = !isTopCap &amp;&amp; sim.actualExtraPipes &gt; 0 &amp;&amp; i &gt;= sim.totalSeg - 1 - sim.actualExtraPipes;
        const isTiMat = getActiveStove().mat === "titanium";
        const p70End = sim.pipe70Count || 5;
        let dia = "Ø70", col = "#f59e0b";
        if (isTiMat) {
          if (st.pipeSys === "ti_nested_83_89") {
            if (isTopCap) { dia = "Ti Ø89캡"; col = "#7c3aed"; }
            else {
              dia = i === 0 ? "Ti Ø83댐퍼" : (i &lt; Math.ceil(sim.totalSeg / 2) ? "Ti Ø83" : "Ti Ø89");
              col = i &lt; Math.ceil(sim.totalSeg / 2) ? "#6366f1" : "#7c3aed";
            }
          } else if (st.pipeSys === "ti_nested_70_76") {
            if (isTopCap) { dia = "Ti Ø76캡"; col = "#a855f7"; }
            else if (i &lt; p70End) { dia = i &gt;= 5 ? "Ti Ø70+" : "Ti Ø70"; col = i &gt;= 5 ? "#0284c7" : "#6366f1"; }
            else if (i === p70End) { dia = "Ti 70-76"; col = "#4f46e5"; }
            else { dia = "Ti Ø76"; col = "#8b5cf6"; }
          } else {
            if (isTopCap) { dia = "Ti Ø70캡"; col = "#7c3aed"; }
            else { dia = i === 0 ? "Ti Ø70댐퍼" : "Ti Ø70"; col = "#6366f1"; }
          }
        } else if (st.pipeSys === "tapered_70_73_76") {
          if (isTopCap) { dia = "Ø76캡"; col = "#f43f5e"; }
          else if (i === 0) { dia = "Ø70댐퍼"; col = "#f59e0b"; }
          else if (i &lt; p70End) { dia = i &gt;= 5 ? "Ø70+" : "Ø70"; col = i &gt;= 5 ? "#0284c7" : "#f59e0b"; }
          else if (i === p70End) { dia = "70-73"; col = "#ea580c"; }
          else if (i &lt;= p70End + 4) { dia = "Ø73"; col = "#f97316"; }
          else if (i === p70End + 5) { dia = "73-76"; col = "#e11d48"; }
          else { dia = "Ø76"; col = "#f43f5e"; }
        } else if (st.pipeSys === "single_70") {
          dia = isTopCap ? "Ø70캡" : (i === 0 ? "Ø70댐퍼" : "Ø70");
        } else {
          dia = isTopCap ? "Ø75캡" : (i === 0 ? "70-75" : "Ø75");
          col = i === 0 ? "#f59e0b" : "#f97316";
        }
        pipeNames.push(dia.replace(/(\d+)-(\d+)/, "지름 $1→$2mm 변환관").replace(/Ø(\d+)/, "지름 $1mm ").replace("댐퍼", "배기 조절관").replace("캡", "불티캡").replace("Ti ", "티타늄 ").replace("+", "").trim() + (isExtraAdded ? " (추가)" : ""));
        if (isExtraAdded) col = "#0284c7";
        const transition=dia.match(/^(\d+)-(\d+)$/);
        if(isTopCap){
          const a=sample(d0),b=sample(d1);
          const width=Number(dia.match(/Ø(\d+)/)[1])/10*scaleX;

        }else if(transition) {
          const a=sample(d0),b=sample(d1);
          pipesHtml+=reducerShape(a.x,a.y,b.x,b.y,+transition[1],+transition[2],scaleX);
        } else pipesHtml += `&lt;polyline points="${subPoly(d0, d1)}" fill="none" stroke="${col}" stroke-width="${(Number(dia.match(/Ø(\d+)/)?.[1]) || 75)/10*scaleX}" stroke-linecap="butt" stroke-linejoin="miter"/&gt;`;

        if (i &gt; 0) {
          const jp = sample(d0);
          ticksHtml += `&lt;line x1="${(jp.x - jp.nx * ((Number(dia.match(/Ø(\d+)/)?.[1])||75)*scaleX/20)).toFixed(1)}" y1="${(jp.y - jp.ny * ((Number(dia.match(/Ø(\d+)/)?.[1])||75)*scaleX/20)).toFixed(1)}" x2="${(jp.x + jp.nx * ((Number(dia.match(/Ø(\d+)/)?.[1])||75)*scaleX/20)).toFixed(1)}" y2="${(jp.y + jp.ny * ((Number(dia.match(/Ø(\d+)/)?.[1])||75)*scaleX/20)).toFixed(1)}" stroke="#fff" stroke-width="2.4"/&gt;`;
          ticksHtml += `&lt;line x1="${(jp.x - jp.nx * ((Number(dia.match(/Ø(\d+)/)?.[1])||75)*scaleX/20)).toFixed(1)}" y1="${(jp.y - jp.ny * ((Number(dia.match(/Ø(\d+)/)?.[1])||75)*scaleX/20)).toFixed(1)}" x2="${(jp.x + jp.nx * ((Number(dia.match(/Ø(\d+)/)?.[1])||75)*scaleX/20)).toFixed(1)}" y2="${(jp.y + jp.ny * ((Number(dia.match(/Ø(\d+)/)?.[1])||75)*scaleX/20)).toFixed(1)}" stroke="#0f172a" stroke-width="1.1"/&gt;`;
        }
        if (st.showNode) {
          const mp = sample((d0 + d1) / 2);
          const horiz = Math.abs(mp.ux) &gt; 0.7;
          const txt = `${i + 1}단　${dia}${isExtraAdded ? "+" : ""}`;
          const pw = Math.max(mobile ? 52 : 40, txt.length * (mobile ? 7.2 : 5.8) + 12);
          const ph = mobile ? 19 : 15;
          const prefSide = i % 2 === 0 ? -1 : 1;

          const candidates = horiz
            ? [
                { cx: mp.x, cy: mp.y - 18 },
                { cx: mp.x, cy: mp.y + 18 },
                { cx: mp.x, cy: mp.y - 34 },
                { cx: mp.x, cy: mp.y + 34 }
              ]
            : [
                { cx: mp.x + prefSide * (pw / 2 + 18), cy: mp.y },
                { cx: mp.x - prefSide * (pw / 2 + 18), cy: mp.y },
                { cx: mp.x + prefSide * (pw / 2 + 24), cy: mp.y - 16 },
                { cx: mp.x - prefSide * (pw / 2 + 24), cy: mp.y - 16 },
                { cx: mp.x + prefSide * (pw / 2 + 24), cy: mp.y + 16 },
                { cx: mp.x - prefSide * (pw / 2 + 24), cy: mp.y + 16 },
                { cx: mp.x + prefSide * (pw / 2 + 64), cy: mp.y },
                { cx: mp.x - prefSide * (pw / 2 + 64), cy: mp.y }
              ];

          let chosen = null;
          for (let cIdx = 0; cIdx &lt; candidates.length; cIdx++) {
            const cand = candidates[cIdx];
            const bx = Math.max(115, Math.min(646 - pw, cand.cx - pw / 2));
            const by = Math.max(8, Math.min(gY - ph - 8, cand.cy - ph / 2));
            if (!overlapsAny(bx, by, pw, ph)) {
              chosen = { bx, by, lxPos: bx + pw / 2, lyPos: by + ph / 2 };
              break;

          }
          if (chosen) {
            reserveBox(chosen.bx, chosen.by, pw, ph);
            labelsHtml += `
              &lt;line x1="${mp.x.toFixed(1)}" y1="${mp.y.toFixed(1)}" x2="${chosen.lxPos.toFixed(1)}" y2="${chosen.lyPos.toFixed(1)}" stroke="${col}" stroke-width="1" stroke-opacity="0.7"/&gt;
              &lt;rect x="${chosen.bx.toFixed(1)}" y="${chosen.by.toFixed(1)}" width="${pw.toFixed(1)}" height="${ph}" rx="4" fill="#fff" stroke="${col}" stroke-width="1.2"/&gt;
              &lt;text x="${chosen.lxPos.toFixed(1)}" y="${(chosen.lyPos + (mobile ? 4 : 3.2)).toFixed(1)}" fill="#0f172a" font-size="${mobile ? 10.8 : 8.6}" font-weight="800" text-anchor="middle"&gt;${txt}&lt;/text&gt;
            `;
          }
        }
      }

      const sleevePx = 50*scaleY;
      const hasMesh=["mesh_guard","both_guard","ti_guard_70"].includes(st.protSys);
      const meshWidth=13*scaleX;
      const center=sim.meshAnchor ? {x:cx+sim.meshAnchor.x*scaleX,y:yOf(sim.meshAnchor.y),ang:sim.meshAnchor.ang} : jackPt;
      const mesh=hasMesh &amp;&amp; (sim.meshAnchor || !sim.parts) ? `&lt;g class="guard-mesh" ${mobile &amp;&amp; sim.meshRange?.travel&gt;0?'id="meshHandle" style="touch-action:none"':""} transform="translate(${center.x},${center.y}) rotate(${center.ang})"&gt;&lt;title&gt;${sim.meshOnWall?"보호망 · Ø70 이중연통 외부에 덧씌움":"실린더형 보호망 · 연통 외부에 덧씌움"}&lt;/title&gt;
        ${mobile &amp;&amp; sim.meshRange?.travel&gt;0?`&lt;rect x="${-meshWidth}" y="${-sleevePx}" width="${2*meshWidth}" height="${2*sleevePx}" fill="transparent"/&gt;`:""}
        &lt;rect x="${-meshWidth/2}" y="${-sleevePx/2}" width="${meshWidth}" height="${sleevePx}" fill="url(#guardMesh)" stroke="#315664" stroke-width=".75"/&gt;
        ${[-1,1].map(end=&gt;`&lt;ellipse cx="0" cy="${end*sleevePx/2}" rx="${meshWidth/2}" ry="${meshWidth*.13}" fill="none" stroke="#264552" stroke-width="1.1"/&gt;`).join("")}&lt;/g&gt;` : "";

      const capOn=sim.parts?.at(-1)?.type==="doubleCap";
      const capWidth=7.5*scaleX, capIconHeight=capOn?sim.parts.at(-1).dy*scaleY:0;
      const capIcon=capOn ? `&lt;g class="double-spark" transform="translate(${topPt.x},${yOf(sim.parts.at(-1).y)})"&gt;
        &lt;title&gt;75파이 스텐 이중 불티캡 · 제품 길이 ${DOUBLE_CAP_LENGTH_CM}cm · 장착 후 노출 ${sim.parts.at(-1).dy}cm&lt;/title&gt;
        &lt;rect x="${-capWidth/2}" y="${-capIconHeight}" width="${capWidth}" height="${capIconHeight}" fill="url(#guardMesh)" stroke="#475569" stroke-width=".8"/&gt;

      const wall=sim.inlinePipe;

      const wallMarker=wall?`&lt;g class="wall-tag" transform="translate(${cx+(wall.x+wall.dx/2)*scaleX},${yOf(wall.y+wall.dy/2)})" ${wallDraggable?`id="wallHandle" style="cursor:ns-resize;touch-action:none" tabindex="0" role="slider" aria-orientation="vertical" aria-label="첫 엘보 위치" aria-valuemin="0" aria-valuemax="${Math.max(sim.lowerStages,wallLimit(sim))}" aria-valuenow="${sim.lowerStages}" aria-valuetext="첫 엘보 ${sim.lowerStages+1}단"`:'pointer-events="none"'}&gt;
        &lt;title&gt;${wallDraggable?"이중연통 중심 · 위아래로 끌거나 방향키로 마디 이동":"이중연통 중심"}&lt;/title&gt;
        ${wallDraggable?`&lt;line x1="${-wall.dx*scaleX/2}" y1="${wall.dy*scaleY/2}" x2="${wall.dx*scaleX/2}" y2="${-wall.dy*scaleY/2}" stroke="transparent" stroke-width="${wallHitW}" pointer-events="stroke"/&gt;`:""}
        &lt;path d="M0 -4l4 4 -4 4 -4 -4z" fill="#334155" stroke="white" stroke-width=".9"/&gt;&lt;/g&gt;`:"";

          &lt;span class="dim-sub ${sim.noFit ? "text-rose-600" : "text-slate-600"}"&gt;최소 이격 ${wallTxt}&lt;/span&gt;
        &lt;/div&gt;
        &lt;div class="mobile-dim-card"&gt;
          &lt;span class="dim-k"&gt;${escapeHtml(fourthTitle)}&lt;/span&gt;
          &lt;span class="dim-v"&gt;${escapeHtml(fourthVal)}&lt;/span&gt;
          &lt;span class="dim-sub text-slate-500"&gt;${escapeHtml(fourthSub)}&lt;/span&gt;
        &lt;/div&gt;
      `;
    }

    function updateTouchDock(sim) {
      const by = (id) =&gt; document.getElementById(id);
      const posLim = Math.max(10, Math.round(maxPosLimit()));
      const xRange = by("touchStoveXRange");
      if (xRange) {
        xRange.min = String(-posLim);
        xRange.max = String(posLim);
        xRange.value = String(Math.round(sim.pos));
      }
      const posOut = by("touchStovePosOut");
      if (posOut) {
        posOut.textContent = st.planView
          ? `X ${sim.pos &gt;= 0 ? "+" : ""}${Math.round(sim.pos)} · Y ${Math.round(st.planDepth)}cm`
          : `중앙 ${sim.pos &gt;= 0 ? "+" : ""}${Math.round(sim.pos)}cm`;
      }

      const yRow = by("touchStoveYRow");
      if (yRow) {
        yRow.classList.toggle("hidden", !st.planView);
        if (st.planView) {
          const yLim = Math.max(10, Math.round(maxDepthLimit()));
          const yRange = by("touchStoveYRange");
          if (yRange) {
            yRange.min = String(-yLim);
            yRange.max = String(yLim);
            yRange.value = String(Math.round(st.planDepth));
          }
          const yOut = by("touchStoveYOut");
          if (yOut) yOut.textContent = `${st.planDepth &gt;= 0 ? "+" : ""}${Math.round(st.planDepth)}cm`;
        }
      }

      const jOut = by("touchJackOut");
      if (jOut) {
        jOut.textContent = sim.elbowCnt ? `높이 ${sim.H_jack}cm · 수평 ${Math.round(sim.D_horiz)}cm` : `높이 ${sim.H_jack}cm`;
      }
      const jHOut = by("touchJackHOut");
      if (jHOut) jHOut.textContent = `${sim.H_jack}cm`;

      const jXWrap = by("touchJackXWrap");
      const jXOut = by("touchJackXOut");
      if (jXWrap) {
        jXWrap.classList.toggle("hidden", st.path === "straight");
        if (jXOut) jXOut.textContent = `${sim.jackXCm &gt;= 0 ? "+" : ""}${Math.round(sim.jackXCm)}cm`;
      }

      const elbowWrap = by("touchElbowWrap");
      const movable = sim.elbowCnt &gt; 0 &amp;&amp; ["double_pipe", "both_guard"].includes(st.protSys);
      if (elbowWrap) {
        elbowWrap.classList.toggle("hidden", !movable);
        if (movable) {
          const lim = Math.max(sim.lowerStages, wallLimit(sim));
          by("touchElbowOut").textContent = `${sim.lowerStages + 1}단 (최대 ${lim + 1}단)`;
          by("touchElbowDown").disabled = sim.lowerStages &lt;= 0;
          by("touchElbowUp").disabled = sim.lowerStages &gt;= lim;
        }
      }

      const qDim = by("qDimToggle");
      if (qDim) {
        qDim.textContent = `📏 치수 ${st.showDim ? "ON" : "OFF"}`;
        qDim.setAttribute("aria-pressed", String(st.showDim));
        qDim.className = "touch-chip-btn" + (st.showDim ? " is-on-dim" : "");
      }
      const qNode = by("qNodeToggle");
      if (qNode) {
        qNode.textContent = `🔩 마디 ${st.showNode ? "ON" : "OFF"}`;
        qNode.setAttribute("aria-pressed", String(st.showNode));
        qNode.className = "touch-chip-btn" + (st.showNode ? " is-on-node" : "");
      }
    }

    function setDragOverlay(text) {
      const el = document.getElementById("dragLiveOverlay");
      if (!el) return;
      if (!text) {
        el.classList.add("hidden");
        el.textContent = "";
      } else {
        el.textContent = text;
        el.classList.remove("hidden");
      }
    }

    function buildBom(sim) {
      const stoveObj = getActiveStove();
      const isTi = stoveObj.mat === "titanium";
      const includedList = [];
      const buyList = [];
      const standardCount=sim.totalSeg-(sim.inlinePipe?1:0);

      const addBuy = (pid, qty, cat, note) =&gt; {
        if (!qty || qty &lt;= 0) return;
        const p = PRODUCTS[pid];
        if (!p) return;
        buyList.push({ id: pid, cat, name: note ? `${p.name} · ${note}` : p.name, qty, unit: p.price, url: p.url, soldOut: /품절/.test(p.status) });
      };

      const mixed = st.pipeSys === "mixed_70_75";
      const incPipes = mixed ? 0 : Number(stoveObj.includedPipes) || 0;
      const incRings = Number(stoveObj.includedRings) || 0;
      const selectedRing=rigPlan(sim).ring;
      const needRings = selectedRing?1:0;
      const extraRings = Math.max(0, needRings - incRings);

      if (incPipes &gt; 0) {
        const useLabel = stoveObj.isRollPipe
          ? `3m 롤연통 기본 사용 (유효 약 300cm)`
          : (standardCount &lt;= incPipes
            ? `기본 ${incPipes}본 중 ${standardCount}본 사용 (추가 직관 불필요)`
            : `기본 ${incPipes}본 전체 사용 + ${standardCount - incPipes}본 추가 필요`);
        includedList.push({
          cat: stoveObj.isRollPipe ? "기본 포함 롤연통" : "기본 포함 연통",
          name: stoveObj.includedSummary,
          detail: sim.direct ? "1단 엘보 직결 · 하단관 미사용 / 설치에 쓰는 기본 구성 "+sim.parts.filter(p=&gt;p.type==="pipe"&amp;&amp;p.source==="기본 구성").length+"본" : useLabel
        });
      }
      if (incRings &gt; 0) {
        includedList.push({
          cat: "기본 포함 고정 부품",
          name: stoveObj.isRollPipe ? "티타늄 연통 고정 클립 3개 + 댐퍼 베이스 + 불티방지캡" : mixed?"연통 고정링 (가이드링) 1개":"연통 고정링 (가이드링) 1개 + 불티방지캡",
          detail: extraRings &gt; 0 ? `강풍·장연통 대비 고정링 ${extraRings}개 추가 권장` : "기본 포함 고정링으로 충분"
        });
      }

      const extra70Cnt = sim.extra70ForElbow || 0;
      if (isTi) {
        if (stoveObj.isRollPipe) {
          if (sim.elbowCnt &gt; 0 || standardCount &gt; incPipes) {
            const extraCnt = Math.max(1, standardCount - incPipes);
            addBuy("p_ti_pipe_70_76", extraCnt, "티타늄 추가 직관", sim.elbowCnt &gt; 0 ? "엘보 연결·원통형 확장용" : `기본 3m 초과 ${extraCnt}본`);
          }
        } else if (incPipes === 0) {
          if (st.pipeSys === "ti_nested_83_89") {
            addBuy("p_ti_set_83_89", 1, "티타늄 연통 세트");
            if (standardCount &gt; 10) addBuy("p_ti_pipe_70_76", standardCount - 10, "티타늄 추가 직관");
          } else if (st.pipeSys === "ti_single_70_76") {
            if(!sim.direct) addBuy("p_ti_damper_base", 1, "티타늄 댐퍼 베이스");
            addBuy("p_ti_pipe_70_76", sim.straightCnt, "티타늄 직관 연통");
          } else {
            addBuy("p_ti_set_70_76", 1, "티타늄 연통 세트");
            if (extra70Cnt &gt; 0) addBuy("p_ti_pipe_70_76", extra70Cnt, "티타늄 70파이 추가 직관", "2번째 엘보까지 Ø70 연결용");
            const extraTopTi = Math.max(0, standardCount - (sim.direct?10:11) - extra70Cnt);
            if (extraTopTi &gt; 0) addBuy("p_ti_pipe_70_76", extraTopTi, "티타늄 상단 연통 직관", "외부 상단 연장용");
          }
        } else {
          if (extra70Cnt &gt; 0) {
            addBuy("p_ti_pipe_70_76", extra70Cnt, "티타늄 70파이 추가 직관", "2번째 엘보까지 Ø70 연결 필수");
          }
          const extraTopTi = Math.max(0, standardCount - (incPipes-(sim.direct?1:0)) - extra70Cnt);
          if (extraTopTi &gt; 0) {
            addBuy("p_ti_pipe_70_76", extraTopTi, "티타늄 76파이 연통 직관", `상단 연장 (+${extraTopTi * sim.effPipe}cm)`);
          }
        }

        if (sim.elbowCnt &gt; 0) addBuy("p_ti_elbow_70", sim.elbowCnt, `티타늄 ${sim.elbowAng}° 엘보`);
        if (st.protSys === "ti_guard_70" &amp;&amp; isFixed60or70Pipe(stoveObj, st.pipeSys)) {
          addBuy("p_ti_guard_70", 1, "스킨 보호", "고정 Ø60·70mm 전용");
        } else {
          addBuy("p_mesh_guard", 1, "스킨 보호", "Ø60~90mm 스텐·티타늄 유연 호환");
        }
        if (extraRings &gt; 0 &amp;&amp; selectedRing?.d===76) addBuy("p_guide_ring", extraRings, "티타늄 외부 고정링", "추가 고정용");
      } else {
        if (mixed) {
          const installed70 = sim.parts.filter(p=&gt;p.label==="Ø70").length;
          if(st.mixedDamper) buyList.push({id:"pomoly30_damper",cat:"선택 부속",name:"포몰리 호환 Ø70 댐퍼 연통 (30cm)",qty:1,unit:null,url:null});
          for (const [d,qty] of [[70,installed70],[75,sim.parts.filter(p=&gt;p.label==="Ø75").length]]) {
            if(qty) buyList.push({id:"pomoly30_"+d,cat:"혼합 구성 직관",name:"포몰리 호환 스텐 Ø"+d+" 직관 (30cm)",qty,unit:null,url:null});
          }
          addBuy("p_reducer_70_75",1,"Ø70 → Ø75 연결");
          if(st.mixedCap==="double") addBuy("p_spark_cap_75",1,"Ø75 최상단");
          if(st.mixedCap==="standard") buyList.push({id:"pomoly30_cap",cat:"선택 부속",name:"포몰리 호환 Ø75 기본 불티캡 (30cm)",qty:1,unit:null,url:null});
        } else if (incPipes === 0) {
          if (st.pipeSys === "tapered_70_73_76") {
            addBuy("p_set_33m", 1, "캠핑투게더 3.3m 기본연통세트", "연통 미포함 모델 필수");
            if (extra70Cnt &gt; 0) addBuy("p_pipe_70", extra70Cnt, "스텐 70파이 추가 직관", "2번째 엘보까지 Ø70 연결 필수");
            const extraTopSt = Math.max(0, standardCount - 12 - extra70Cnt);
            if (extraTopSt &gt; 0) addBuy("p_pipe_76", extraTopSt, "스텐 76파이 연통 직관");
          } else if (st.pipeSys === "single_70") {
            if(!sim.direct) addBuy("p_damper_70", 1, "스텐 하단 댐퍼");
            addBuy("p_pipe_70", sim.straightCnt, "스텐 직관 연통");
          } else {
            addBuy("p_reducer_70_75", 1, "스텐 구경 레듀셔");
            addBuy("p_pipe_75", sim.straightCnt, "스텐 직관 연통");
            addBuy("p_spark_cap_75", 1, "스텐 최상단 불티캡");
          }
        } else {
          if (extra70Cnt &gt; 0 &amp;&amp; st.pipeSys === "tapered_70_73_76") {
            addBuy("p_pipe_70", extra70Cnt, "스텐 70파이 추가 직관", "2번째 엘보까지 Ø70 연결 필수");
          }
          const extraTopSt = Math.max(0, standardCount - (incPipes-(sim.direct?1:0)) - extra70Cnt);
          if (extraTopSt &gt; 0) {
            if (st.pipeSys === "tapered_70_73_76") {
              addBuy("p_pipe_76", extraTopSt, "스텐 76파이 연통 직관", `상단 연장 · 3중 겹침 수납 호환`);
            } else if (st.pipeSys === "single_75") {
              addBuy("p_reducer_70_75", 1, "스텐 구경 레듀셔", "Ø70→Ø75 변환");
              addBuy("p_pipe_75", extraTopSt, "스텐 추가 연통 직관", `기본 ${incPipes}본 초과분`);
            } else {
              addBuy("p_pipe_70", extraTopSt, "스텐 추가 연통 직관", `기본 ${incPipes}본 초과분`);
            }
          }
        }

        if (sim.elbowCnt &gt; 0) addBuy(st.pipeSys === "single_75" ? "p_elbow_75" : "p_elbow_70", sim.elbowCnt, `스텐 ${sim.elbowAng}° 엘보`);
        if ((!mixed || sim.inlinePipe) &amp;&amp; (st.protSys === "double_pipe" || st.protSys === "both_guard")) addBuy(st.pipeSys === "single_75" ? "p_double_75" : "p_double_70", 1, "스킨 보호");
        if (st.protSys === "mesh_guard" || st.protSys === "both_guard") addBuy("p_mesh_guard", 1, "스킨 보호", "Ø60~90mm 유연 호환");
        if (st.protSys === "ti_guard_70" &amp;&amp; isFixed60or70Pipe(stoveObj, st.pipeSys)) addBuy("p_ti_guard_70", 1, "스킨 보호", "고정 Ø60·70mm 전용");
        if (extraRings &gt; 0 &amp;&amp; selectedRing?.d===76) addBuy("p_guide_ring", extraRings, "외부 고정링");
      }

      if (sim.H_stand &gt;= 50) {
        const isDweller = stoveObj.id === "dweller_max3" || stoveObj.id === "dweller_ti3";
        addBuy(isDweller ? "p_dweller_stand" : "p_stand_550", 1, "난로 옵션 스탠드");
      }

      if (sim.parts &amp;&amp; st.pipeSys==="tapered_70_73_76") {
        for(let i=buyList.length-1;i&gt;=0;i--) if(["p_pipe_70","p_pipe_73","p_pipe_76"].includes(buyList[i].id)) buyList.splice(i,1);
        for(const d of pipeSizes()) {
          const qty=sim.parts.filter(p=&gt;p.type==="pipe" &amp;&amp; p.diameter===d &amp;&amp; p.source!=="기본 구성").length;
          addBuy("p_pipe_"+d,qty,"추가 직관");
        }
      }
      if(st.doubleSpark &amp;&amp; canAddDoubleSpark(sim)) addBuy("p_spark_cap_75",1,"기본 불티캡 교체","Ø76 연결부용");

      buyList.forEach((it) =&gt; {
        if (typeof st.qtyOverrides[it.id] === "number" &amp;&amp; st.qtyOverrides[it.id] &gt;= 1) {
          it.qty = st.qtyOverrides[it.id];
        }
      });
      Object.entries(st.extraBuyItems || {}).forEach(([pid, q]) =&gt; {
        const qtyNum = Number(q) || 0;
        if (qtyNum &lt;= 0) return;
        const existing = buyList.find((x) =&gt; x.id === pid);
        if (existing) {
          if (typeof st.qtyOverrides[pid] !== "number") existing.qty += qtyNum;
        } else {
          const p = PRODUCTS[pid];
          if (!p) return;
          buyList.push({
            id: pid,
            cat: "직접 추가",
            name: p.name,
            qty: qtyNum,
            unit: p.price,
            url: p.url,
            soldOut: /품절/.test(p.status),
            isManual: true
          });
        }
      });

      return { includedList, buyList, incPipes, extraPipeNeeded: Math.max(0, standardCount - incPipes) };
    }

    function adjustPipe(d,delta){
      const sizes=pipeSizes();
      if(sizes.includes(d))st.added[d]=Math.max(0,Math.min(50,st.added[d]+delta));
      else if(!sizes.length &amp;&amp; d===0)st.extraOutPipes=Math.max(-4,Math.min(6,st.extraOutPipes+delta));
    }
    function renderPipeRows(sizes){
      const root=document.getElementById("pipeRows");
      if(root.dataset.system!==st.pipeSys){
        root.dataset.system=st.pipeSys;
        root.innerHTML=(sizes.length?sizes:[0]).map(d=&gt;{
          const name=d?`Ø${d} 직관`:st.pipeSys==="single_75"?"Ø75 직관":"Ø83–89 세트 연통";
          const color=diameterColor[d|| (st.pipeSys==="single_75"?75:83)];
          return `&lt;div class="pipe-row" role="group" aria-label="${name}" data-diameter="${d}" style="--pipe-color:${color}"&gt;
            &lt;span class="pipe-name"&gt;${name}&lt;/span&gt;&lt;div class="pipe-step"&gt;
            &lt;button type="button" data-delta="-1" aria-label="${name} 1본 빼기"&gt;−&lt;/button&gt;&lt;output aria-label="${name} 조정 수량"&gt;&lt;/output&gt;&lt;button type="button" data-delta="1" aria-label="${name} 1본 추가"&gt;+&lt;/button&gt;
            &lt;/div&gt;&lt;/div&gt;`;
        }).join("");
      }
      for(const row of root.children){
        const d=Number(row.dataset.diameter),n=d?st.added[d]:st.extraOutPipes;
        row.querySelector("output").textContent=n+"본";
        row.querySelector('[data-delta="-1"]').disabled=n&lt;=(d?0:-4);
        row.querySelector('[data-delta="1"]').disabled=n&gt;=(d?50:6);
      }
    }
    function populateExtraAddSelect() {
      const sel = document.getElementById("sAddExtraSelect");
      if (!sel) return;
      const stoveObj = getActiveStove();
      const prevVal = sel.value;
      const canUseTiGuard = isFixed60or70Pipe(stoveObj, st.pipeSys);
      const stoveIds = new Set(STOVES.map((s) =&gt; s.pid).filter(Boolean));
      const compatList = Object.values(PRODUCTS).filter((p) =&gt; {
        if (p.deleted) return false;
        if (stoveIds.has(p.id)) return false;
        if (p.id === "p_ti_guard_70" &amp;&amp; !canUseTiGuard) return false;
        return p.mat === stoveObj.mat || p.mat === "both";
      });
      sel.innerHTML = compatList
        .map((p) =&gt; `&lt;option value="${escapeHtml(p.id)}"&gt;${escapeHtml(p.name)} — ${formatKRW(p.price)} (${escapeHtml(p.status)})&lt;/option&gt;`)
        .join("");
      if (prevVal &amp;&amp; compatList.some((p) =&gt; p.id === prevVal)) sel.value = prevVal;
    }

    function render() {
      st.planDepth=clampDepth(st.planDepth);st.stovePosCm=clampPos(st.stovePosCm);
      const sim = compute();
      document.getElementById("mixedPipeNote").hidden=st.pipeSys!=="mixed_70_75";

      document.getElementById("skinDistance").textContent=(bodySizes.has(st.stoveId)?"입력 외측 치수":"예시 외측 치수 40×40cm")+
        (sim.noFit?" · 45cm 확보 불가":" · 본체~스킨 최소 "+(Math.floor((sim.minWall+1e-8)*10)/10).toFixed(1)+"cm");
      const t = getTent();
      const stoveObj = getActiveStove();
      document.getElementById("guardInstallHelp").textContent=[
        sim.inlinePipe ? "이중연통은 마디 사이에 1본 연결합니다. 제품 50cm − 겹침 "+sim.overlap+"cm = 조립 경로 +"+(50-sim.overlap)+"cm." : "",
        st.protSys==="both_guard" &amp;&amp; st.pipeSys!=="single_75" ? "Ø70 이중연통 바깥에 보호망(Ø13 × 50cm)을 덧씌웁니다. 보호망은 이중연통과 함께 이동하며 설치 높이는 그대로입니다." : ["mesh_guard","both_guard","ti_guard_70"].includes(st.protSys) ? "보호망(Ø13 × 50cm)은 Ø60~90mm 직관에 덧씌웁니다. 홀잭 중심에 가까운 허용 구간에 자동 배치하며, 엘보 구성에서는 두 엘보 사이의 직관에 놓습니다." : ""
      ].filter(Boolean).join(" ");
      const rig=rigPlan(sim);
      drawRigPanel(sim,rig);
      updateMobileDimHud(sim, rig);
      updateTouchDock(sim);

      const byId=id=&gt;document.getElementById(id);
      const bearing=st.bearing??(sim.jackXCm&gt;=sim.pos?0:180);
      byId("bearingControl").style.display=st.planView&amp;&amp;sim.elbowCnt&amp;&amp;sim.parts?"block":"none";
