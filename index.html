              ${it.url ? `&lt;a href="${sanitizeUrl(it.url)}" data-bom-visit="${escapeHtml(it.id)}" target="_blank" rel="noopener noreferrer" class="px-3 py-1.5 rounded-xl ${isVisited ? "bg-emerald-600 hover:bg-emerald-700 text-white border border-emerald-600" : "bg-white hover:bg-slate-900 hover:text-white text-slate-800 border border-slate-300"} text-[11px] font-bold whitespace-nowrap transition"&gt;${isVisited ? "열어봄 ↗" : "상품 바로가기 ↗"}&lt;/a&gt;` : ""}
            &lt;/div&gt;
          &lt;/div&gt;
        `;
      });

      const visProgEl = document.getElementById("sVisitedProgress");
      if (visProgEl) {
        visProgEl.textContent = buyList.length &gt; 0 ? `상품 페이지 열어봄 ${visitedCnt} / ${buyList.length}종` : "추가 구매 없음";
      }

      document.getElementById("sBomCards").innerHTML = cards.length &gt; 0
        ? cards.join("")
        : `&lt;div class="sm:col-span-2 rounded-2xl border border-emerald-200 bg-emerald-50/40 px-4 py-3 text-xs font-bold text-emerald-800"&gt;✓ 난로 기본 포함 연통·부속품만으로 설치가 가능합니다. 위 선택창에서 여유 연통이나 부속품을 자유롭게 추가할 수 있습니다.&lt;/div&gt;`;
      if(sim.noFit || sim.incompatibleElbow) {
        document.getElementById("sBomCards").textContent=sim.noFit?"본체 외곽 이격거리 45cm 확보 후 견적을 확인하세요.":"연통 규격 변경 후 부품 목록을 확인하세요.";
        document.getElementById("sIncludedStatusPill").textContent="호환 구성 확인 필요";
      }
      const copyBtn = document.getElementById("sCopyQuoteBtn");
      if (sim.blocked) {
        document.getElementById("sTotalQty").textContent = "추천 보류";
        document.getElementById("sTotalPrice").textContent = "조건 보정 필요";
        document.getElementById("sTotalSub").textContent = "상단 경고의 [자동 보정] 버튼을 눌러 조건을 맞춰 주세요.";
        copyBtn.disabled = true;
      } else {
        document.getElementById("sTotalQty").textContent = `추가 구매 ${qtySum}개 선택`;
        document.getElementById("sTotalPrice").textContent = formatKRW(sum);
        const stoveP = stoveObj.pid ? PRODUCTS[stoveObj.pid] : null;
        document.getElementById("sTotalSub").textContent = stoveP ? `난로(${stoveP.name} ${formatKRW(stoveP.price)}) 포함 시 ${formatKRW(sum + stoveP.price)}` : "보유 난로 기준 추가 연통 합계";
        copyBtn.disabled = false;
      }

      st.lastQuoteText = [
        `[캠핑투게더 연통 시뮬레이터 연통 목록]`,
        `- 텐트: ${t.name} (천장 ${sim.H_tent}cm / 홀잭 ${sim.H_jack}cm)`,
        `- 난로: ${stoveObj.name} (난로 ${sim.H_stove}cm + 스탠드 ${sim.H_stand}cm = 배기구 높이 ${sim.H_start}cm)`,
        `- 바닥~${heightEndpoint(sim)}: ${sim.topH}cm (최고점~${heightEndpoint(sim)} ${sim.roofClr &gt;= 0 ? "+" : ""}${sim.roofClr}cm · 총 ${sim.totalSeg}본 · 난이도 ${sim.diff} · 배기 저항 ${sim.resistance})`,
        ...(sim.parts ? ["- 조립 순서: "+sim.parts.map(p=&gt;p.label+(p.source==="기본 구성"?"":" ("+p.source+")")).join(" → ")] : []),
        ...(st.doubleSpark &amp;&amp; canAddDoubleSpark(sim) ? [`- 기본 불티캡 제외 · Ø75 스텐 이중 불티캡 (제품 ${DOUBLE_CAP_LENGTH_CM}cm · 겹침 ${sim.overlap}cm · 노출 ${DOUBLE_CAP_LENGTH_CM-sim.overlap}cm)`] : []),
        ...(["mesh_guard","both_guard","ti_guard_70"].includes(st.protSys)?[sim.meshOnWall?"- 보호망: Ø70 이중연통 외부에 덧씌움 (조립 길이 증가 없음)":"- 보호망: 연통 외부 덧씌움 (조립 길이 증가 없음)"]:[]),
        "- 고정링: "+rigSummary(rig), ...(rig.ring?[lineSummary(rig), "스트링 3줄 · 스토퍼와 철제 비너 각 3개"]:[]),
        ...(installed.rest?["- 연통 받침대 · 설치 높이 "+supportHeight(sim).toFixed(1)+"cm"]:[]),
        ...(installed.pole?["- 연통 지지대 · 설치 높이 "+poleHeight(sim).toFixed(1)+"cm · 스텐타이 3점"]:[]),
        `- [기본 포함 연통·부속]: ${includedList.length ? includedList.map((x) =&gt; `${x.name} (${x.detail})`).join(" / ") : "없음"}`,
        `- [추가 구매 필요 품목]:`,
        ...buyList.filter((it) =&gt; (it.soldOut ? Boolean(st.includedSoldOut[it.id]) : !st.excluded[it.id])).map((it) =&gt; `  · ${it.cat}: ${it.name} × ${it.qty}개 (${it.unit==null?"가격 미등록 · 합계 제외":formatKRW(it.qty * it.unit)})${it.url?" → "+it.url:""}`),
        `- 추가 구매 합계: ${formatKRW(sum)}`
      ].join("\n");
    }

    let rafId = 0;
    function scheduleRender() {
      if (rafId) return;
      rafId = requestAnimationFrame(() =&gt; { rafId = 0; render(); });
    }

    function showToast(msg) {
      const el = document.getElementById("toastEl");
      const txt = document.getElementById("toastText");
      if (!el || !txt) return;
      txt.textContent = msg;
      el.classList.remove("hidden");
      setTimeout(() =&gt; el.classList.add("hidden"), 2500);
    }

    function syncInputs() {
      const setV = (id, val) =&gt; { const el = document.getElementById(id); if (el) el.value = val; };
      setV("sTentSelect", st.tentId);
      setV("sTentH", st.tentH);
      setV("sTentHRange", st.tentH);
      setV("sJackH", st.jackH);
      setV("sJackHRange", st.jackH);
      setV("sStoveSelect", st.stoveId);
      setV("sStoveH", st.stoveH);
      setV("sStoveHRange", st.stoveH);
      setV("sStandH", st.standH);
      setV("sPipeSys", st.pipeSys);
      setV("sProtSys", st.protSys);
    }

    function initApp() {
      const el=id=&gt;document.getElementById(id);
      el("ringJoint").oninput=e=&gt;{const j=rigPlan(compute()).joints[Number(e.target.value)];if(j){rigState.height=j.y;render();}};
      for(const d of [73,76])el("ring"+d).onclick=()=&gt;{const r=rigPlan(compute());const j=r.joints.filter(j=&gt;j.d===d).at(-1);if(j){rigState.height=j.y;render();}};

      for(const id of ["bodyWidth","bodyDepth","bend45","bend90"]) {
        document.getElementById(id).addEventListener("change",e=&gt;{
          const input=e.currentTarget, value=input.valueAsNumber;
          if(Number.isFinite(value) &amp;&amp; value&gt;=Number(input.min) &amp;&amp; value&lt;=Number(input.max)) {
            if(id.startsWith("bend")) elbowLegs[id.slice(4)]=value;
            else bodySizes.set(st.stoveId,{...bodySize(),[id==="bodyWidth"?"width":"depth"]:value});
          }
          render();
        });
      }
      if (window.__ctSimpleInitialized) return;
      window.__ctSimpleInitialized = true;

      let resizeTimer = 0;
      window.addEventListener("resize", () =&gt; {
        clearTimeout(resizeTimer);
        resizeTimer = setTimeout(scheduleRender, 120);
      });

      const tSel = document.getElementById("sTentSelect");
      tSel.innerHTML = "";
      TENTS.forEach((t) =&gt; { const o = document.createElement("option"); o.value = t.id; o.textContent = t.name; tSel.appendChild(o); });
      const sSel = document.getElementById("sStoveSelect");
      sSel.innerHTML = "";
      const grpStainless = document.createElement("optgroup");
      grpStainless.label = "🔩 스테인리스 난로 (스테인리스 연통 전용)";
      const grpTitanium = document.createElement("optgroup");
      grpTitanium.label = "🪶 티타늄 난로 (티타늄 연통 전용)";
      STOVES.forEach((s) =&gt; {
        const o = document.createElement("option");
        o.value = s.id;
        o.textContent = s.name;
        (s.mat === "titanium" ? grpTitanium : grpStainless).appendChild(o);
      });
      sSel.appendChild(grpStainless);
      sSel.appendChild(grpTitanium);

      tSel.addEventListener("change", (e) =&gt; {
        st.tentId = e.target.value;
        const t = getTent();
        st.tentH = t.h; st.jackH = t.jh; st.path = t.path; st.extraOutPipes = 0; st.added={70:0,73:0,75:0,76:0};
        st.isAiEstimated = false;
        resetPos(); syncInputs(); render();
      });
      sSel.addEventListener("change", (e) =&gt; {
        const prevMat = getActiveStove().mat;
        st.stoveId = e.target.value;
        const s = getActiveStove();
        st.stoveH = s.h;
        st.pipeSys = s.pipe;
        st.protSys = s.mat === "titanium"
          ? (isFixed60or70Pipe(s, s.pipe) ? "ti_guard_70" : "mesh_guard")
          : "double_pipe";
        syncMaterialSelectors();
        syncInputs();
        render();
        if (prevMat !== s.mat) {
          showToast(
            s.mat === "titanium"
              ? "🪶 티타늄 난로 선택으로 티타늄 전용 연통으로 자동 변경되었습니다."
              : "🔩 스테인리스 난로 선택으로 스테인리스 전용 연통으로 자동 변경되었습니다."
          );
        }
      });

      const aiEstDismissBtn = document.getElementById("sAiEstDismissBtn");
      if (aiEstDismissBtn) {
        aiEstDismissBtn.addEventListener("click", () =&gt; {
          st.isAiEstimated = false;
          render();
        });
      }

      const settingsBtn = document.getElementById("btnDiagramSettings");
      const settingsDrawer = document.getElementById("diagramSettingsDrawer");
      const closeSettingsBtn = document.getElementById("btnCloseDiagramSettings");
      if (settingsBtn &amp;&amp; settingsDrawer) {
        settingsBtn.addEventListener("click", (e) =&gt; {
          e.stopPropagation();
          const isHidden = settingsDrawer.classList.toggle("hidden");
          settingsBtn.setAttribute("aria-expanded", String(!isHidden));
        });
        if (closeSettingsBtn) {
          closeSettingsBtn.addEventListener("click", () =&gt; {
            settingsDrawer.classList.add("hidden");
            settingsBtn.setAttribute("aria-expanded", "false");
          });
        }
        document.addEventListener("click", (e) =&gt; {
          if (!settingsDrawer.classList.contains("hidden") &amp;&amp; !settingsDrawer.contains(e.target) &amp;&amp; !settingsBtn.contains(e.target)) {
            settingsDrawer.classList.add("hidden");
            settingsBtn.setAttribute("aria-expanded", "false");
          }
        });
      }

      const bindNumRange = (numId, rangeId, key) =&gt; {
        const nEl = document.getElementById(numId), rEl = document.getElementById(rangeId);
        if (!nEl || !rEl) return;
        const min = Number(nEl.min), max = Number(nEl.max);
        nEl.addEventListener("input", () =&gt; {
          const v = Number(nEl.value);
          if (!Number.isFinite(v) || v &lt; min || v &gt; max) return;
          st[key] = v; rEl.value = v;
          if (key === "jackH") {
            const fixed = clampJackForAngle(st.jackPosCm, st.jackH);
            st.jackPosCm = fixed.jackPosCm;
          }
          scheduleRender();
        });
        nEl.addEventListener("blur", () =&gt; {
          const v = Number(nEl.value);
          const c = Number.isFinite(v) ? Math.max(min, Math.min(max, v)) : min;
          st[key] = c; nEl.value = c; rEl.value = c;
          if (key === "jackH") {
            const fixed = clampJackForAngle(st.jackPosCm, st.jackH);
            st.jackPosCm = fixed.jackPosCm;
          }
          render();
        });
        rEl.addEventListener("input", () =&gt; {
          st[key] = Number(rEl.value) || 0;
          nEl.value = st[key];
          if (key === "jackH") {
            const fixed = clampJackForAngle(st.jackPosCm, st.jackH);
            st.jackPosCm = fixed.jackPosCm;
          }
          scheduleRender();
        });
      };
      bindNumRange("sTentH", "sTentHRange", "tentH");
      bindNumRange("sJackH", "sJackHRange", "jackH");
      bindNumRange("sStoveH", "sStoveHRange", "stoveH");

      document.getElementById("sStandH").addEventListener("change", (e) =&gt; {
        st.standH = Math.max(0, Math.min(80, Number(e.target.value) || 0));
        e.target.value = st.standH; render();
      });
      document.querySelectorAll(".s-stand-btn").forEach((b) =&gt; b.addEventListener("click", () =&gt; {
        st.standH = Number(b.getAttribute("data-stand")) || 0;
        syncInputs(); render();
      }));
      for(const button of document.querySelectorAll(".s-path-btn")){
        const {diff,resistance}=installationModes[button.dataset.path];
        button.querySelector(".mode-rating").innerHTML=`&lt;span class="rating-install"&gt;난이도 &lt;strong&gt;${diff}&lt;/strong&gt;&lt;/span&gt;&lt;span class="rating-flow"&gt;배기 저항 &lt;strong&gt;${resistance}&lt;/strong&gt;&lt;/span&gt;`;
      }
      document.querySelectorAll(".s-path-btn").forEach((b) =&gt; b.addEventListener("click", () =&gt; {
        st.path = b.getAttribute("data-path");
        resetPos(); render();
      }));
      document.getElementById("sPipeSys").addEventListener("change", (e) =&gt; {
        st.pipeSys = e.target.value;
        if(st.pipeSys==="mixed_70_75"){st.added[70]=0;st.added[75]=0;st.mixedAuto=false;}
        syncMaterialSelectors();
        render();
      });
      document.getElementById("mixedAuto").onchange=e=&gt;{st.mixedAuto=e.target.checked;render();};
      document.getElementById("mixedDamper").onchange=e=&gt;{st.mixedDamper=e.target.checked;render();};
      document.getElementById("mixedCap").onchange=e=&gt;{st.mixedCap=e.target.value;render();};
      document.getElementById("doubleSparkOption").addEventListener("change",e=&gt;{st.doubleSpark=e.target.checked;render();});
      document.getElementById("sProtSys").addEventListener("change", (e) =&gt; { st.protSys = e.target.value; render(); });

      document.getElementById("pipeRows").addEventListener("click",e=&gt;{
        const button=e.target.closest("button[data-delta]");
        if(!button||button.disabled)return;
        adjustPipe(Number(button.closest(".pipe-row").dataset.diameter),Number(button.dataset.delta));
        render();
      });
      document.getElementById("btnExtraPipeReset").addEventListener("click", () =&gt; {
        st.extraOutPipes = 0; st.added={70:0,73:0,75:0,76:0};
        render();
      });

      const bf = document.getElementById("btnViewFront"), bs = document.getElementById("btnViewSide");
      const bp = document.getElementById("btnViewPlan"), details = document.getElementById("planToggle");
      const qf = document.getElementById("qViewFront"), qs = document.getElementById("qViewSide"), qp = document.getElementById("qViewPlan");
      function updateViewBtns(){
        const isFront = !st.planView &amp;&amp; st.view === "front";
        const isSide = !st.planView &amp;&amp; st.view === "side";
        const isPlan = st.planView;
        for(const [button,active] of [[bf,isFront],[bs,isSide],[bp,isPlan]]){
          button.className=(button===bp?"col-span-2 ":"")+"px-2.5 py-1.5 rounded-xl text-xs font-bold "+(active?"bg-slate-900 text-white":"bg-slate-100 text-slate-600");
          button.setAttribute("aria-pressed",String(active));
        }
        for(const [button,active] of [[qf,isFront],[qs,isSide],[qp,isPlan]]){
          if(button) button.setAttribute("aria-pressed", String(active));
        }
      }
      function selectView(view){
        st.planView=view==="plan";
        if(!st.planView &amp;&amp; st.view!==view){st.view=view;resetPos();}
        details.open=st.planView;updateViewBtns();render();
      }
      for(const [button,view] of [[bf,"front"],[bs,"side"],[bp,"plan"],[qf,"front"],[qs,"side"],[qp,"plan"]]){
        if(button) button.addEventListener("click",()=&gt;selectView(view));
      }
      details.addEventListener("toggle",()=&gt;{if(details.open!==st.planView)selectView(details.open?"plan":st.view);});
      document.getElementById("horizontalSupport").onchange=e=&gt;{st.horizontalSupport=e.target.value;render();};
      for(const id of ["restHeightOn","poleHeightOn"])document.getElementById(id).addEventListener("change",render);
      document.getElementById("elbowStart").addEventListener("change",e=&gt;{st.elbowStart=e.target.value;render();});
      updateViewBtns();

      const toggleDim = () =&gt; {
        st.showDim = !st.showDim;
        const btn = document.getElementById("btnDimToggle");
        btn.textContent = `📏 치수선 ${st.showDim ? "ON" : "OFF"}`;
        btn.className = st.showDim
          ? "px-2.5 py-1.5 rounded-xl text-xs font-bold bg-sky-600 text-white shadow-sm transition"
          : "px-2.5 py-1.5 rounded-xl text-xs font-semibold bg-slate-100 text-slate-500 border border-slate-200 transition";
        render();
      };
      const toggleNode = () =&gt; {
        st.showNode = !st.showNode;
        const btn = document.getElementById("btnNodeToggle");
        btn.textContent = `🔩 마디·번호 ${st.showNode ? "ON" : "OFF"}`;
        btn.className = st.showNode
          ? "px-2.5 py-1.5 rounded-xl text-xs font-bold bg-orange-600 text-white shadow-sm transition"
          : "px-2.5 py-1.5 rounded-xl text-xs font-semibold bg-slate-100 text-slate-500 border border-slate-200 transition";
        render();
      };
      document.getElementById("btnDimToggle").addEventListener("click", toggleDim);
      document.getElementById("qDimToggle").addEventListener("click", toggleDim);
      document.getElementById("btnNodeToggle").addEventListener("click", toggleNode);
      document.getElementById("qNodeToggle").addEventListener("click", toggleNode);

      document.getElementById("stringsBtn").onclick=e=&gt;{
        st.showStrings=!st.showStrings;e.currentTarget.setAttribute("aria-pressed",String(st.showStrings));e.currentTarget.textContent="스트링 "+(st.showStrings?"ON":"OFF");render();
      };
      document.getElementById("bearingRange").oninput=e=&gt;{st.bearing=Number(e.target.value);render();};
      document.getElementById("bearingMinus").addEventListener("click", () =&gt; {
        const cur = st.bearing ?? (Math.round(st.jackPosCm) &gt;= st.stovePosCm ? 0 : 180);
        st.bearing = (cur - 15 + 360) % 360;
        render();
      });
      document.getElementById("bearingPlus").addEventListener("click", () =&gt; {
        const cur = st.bearing ?? (Math.round(st.jackPosCm) &gt;= st.stovePosCm ? 0 : 180);
        st.bearing = (cur + 15) % 360;
        render();
      });

      document.getElementById("toggleFormulaBtn").addEventListener("click", () =&gt; {
        document.getElementById("formulaBox").classList.toggle("hidden");
      });

      // Touch dock stove/jack/elbow controls
      const moveStoveBy = (dx) =&gt; {
        st.stovePosCm = clampPos(st.stovePosCm + dx);
        if (st.path === "elbow45" || st.path === "elbow90") {
          const clamped = clampJackForAngle(st.jackPosCm, st.jackH);
          st.jackPosCm = clamped.jackPosCm;
        }
        render();
      };
      document.getElementById("touchStoveMinus").addEventListener("click", () =&gt; moveStoveBy(-5));
      document.getElementById("touchStovePlus").addEventListener("click", () =&gt; moveStoveBy(5));
      document.getElementById("touchStoveXRange").addEventListener("input", (e) =&gt; {
        st.stovePosCm = clampPos(Number(e.target.value));
        if (st.path === "elbow45" || st.path === "elbow90") {
          const clamped = clampJackForAngle(st.jackPosCm, st.jackH);
          st.jackPosCm = clamped.jackPosCm;
        }
        scheduleRender();
      });
      document.getElementById("touchStoveYRange").addEventListener("input", (e) =&gt; {
        st.planDepth = clampDepth(Number(e.target.value));
        scheduleRender();
      });

      const nudgeJack = (dx, dh) =&gt; {
        const clamped = clampJackForAngle(st.jackPosCm + dx, st.jackH + dh);
        st.jackPosCm = clamped.jackPosCm;
        st.jackH = clamped.jackH;
        const jIn = document.getElementById("sJackH");
        const jRg = document.getElementById("sJackHRange");
        if (jIn) jIn.value = st.jackH;
        if (jRg) jRg.value = st.jackH;
        render();
      };
      document.getElementById("touchJackHMinus").addEventListener("click", () =&gt; nudgeJack(0, -5));
      document.getElementById("touchJackHPlus").addEventListener("click", () =&gt; nudgeJack(0, 5));
      document.getElementById("touchJackXMinus").addEventListener("click", () =&gt; nudgeJack(-5, 0));
      document.getElementById("touchJackXPlus").addEventListener("click", () =&gt; nudgeJack(5, 0));

      const nudgeElbowStage = (delta) =&gt; {
        const sim = compute();
        const lim = Math.max(sim.lowerStages, wallLimit(sim));
        st.wallSteps = Math.max(0, Math.min(lim, sim.lowerStages + delta));
        st.elbowStart = "drag";
        render();
      };
      document.getElementById("touchElbowDown").addEventListener("click", () =&gt; nudgeElbowStage(-1));
      document.getElementById("touchElbowUp").addEventListener("click", () =&gt; nudgeElbowStage(1));

      document.querySelectorAll(".pos-quick-btn").forEach((b) =&gt; b.addEventListener("click", () =&gt; {
        const a = b.getAttribute("data-pos-act");
        if (a === "left") st.stovePosCm = clampPos(-Math.round(getSpan() * 0.28));
        else if (a === "center") {st.stovePosCm=0;st.planDepth=0;}
        else if (a === "jack") st.stovePosCm = clampPos(st.jackPosCm);
        else resetPos();
        render();
      }));

      // SVG &amp; Plan Pointer Dragging with Enlarged Touch Targets + Live Overlay
      const svg = document.getElementById("heroSvg");
      for(const plan of [document.getElementById("heroPlan"),document.getElementById("guyPlan")]){
        let drag=null;
        plan.addEventListener("pointerdown",e=&gt;{
          const rotate=!!e.target.closest?.("[data-rotate]");
          if(drag||(!rotate&amp;&amp;!e.target.closest?.("[data-plan-stove]")))return;
          const box=plan.getBoundingClientRect(),px=Number(plan.dataset.scale)*Math.min(box.width/430,box.height/220);
          if(!(px&gt;0))return;
          drag={rotate,cx:box.left+box.width/2+st.stovePosCm*px,cy:box.top+box.height/2+st.planDepth*px,id:e.pointerId,start:e.clientX,startY:e.clientY,pos:st.stovePosCm,depth:st.planDepth,px};
          try{plan.setPointerCapture(e.pointerId);}catch{}

      function getAllSearchableTentsSimple() {
        const main = TENTS.filter((t) =&gt; t.id !== "custom_tent").map((t) =&gt; ({
          source: "main", id: t.id,
          displayName: t.name.replace(/^\[[^\]]+\]\s*/, ""),

          shape: t.shape, w: t.w, h: t.h, jh: t.jh, path: t.path
        }));
        const extra = EXTRA_TENT_CATALOG.map((t) =&gt; ({
          source: "extra", id: t.id,
          displayName: `${t.brand} ${t.name}`.trim(),
          aliases: `${t.brand} ${t.name} ${t.aliases || ""}`,
          shape: t.shape, w: t.w, h: t.h, jh: t.jh, path: t.path
        }));
        return [...main, ...extra];
      }

      function searchTentCandidatesSimple(query) {
        const qRaw = String(query || "").trim();
        const q = normalizeSearchStr(qRaw);
        if (!q) return [];
        const tokens = qRaw.toLowerCase().split(/\s+/).map(normalizeSearchStr).filter(Boolean);
        const list = getAllSearchableTentsSimple();
        const scored = [];
        for (const item of list) {
          const hay = normalizeSearchStr(item.displayName + " " + item.aliases);
          const allTokensMatch = tokens.every((tk) =&gt; hay.includes(tk));
          if (!allTokensMatch) continue;
          let score = 0;
          if (hay === q) score += 100;
          else if (hay.includes(q)) score += 60;
          else score += 35;
          scored.push({ item, score });
        }
        scored.sort((a, b) =&gt; b.score - a.score);
        return scored.slice(0, 7).map((s) =&gt; s.item);
      }

      const AI_TENT_CACHE_KEY = "ct_ai_tent_web_cache_v3";
      function readAiTentCache(q) {
        try {
          const map = JSON.parse(localStorage.getItem(AI_TENT_CACHE_KEY) || "{}");
          return map[normalizeSearchStr(q)] || null;
        } catch (e) { return null; }
      }
      function writeAiTentCache(q, payload) {
        try {
          const map = JSON.parse(localStorage.getItem(AI_TENT_CACHE_KEY) || "{}");
          map[normalizeSearchStr(q)] = payload;
          const keys = Object.keys(map);
          if (keys.length &gt; 50) delete map[keys[0]];
          localStorage.setItem(AI_TENT_CACHE_KEY, JSON.stringify(map));
        } catch (e) {}

      async function callDirectGeminiSimple(query) {
        return {
          ok: false,
          code: "LOCAL_PREVIEW",
          error: "미리보기 환경입니다. 배포된 사이트(Vercel)에서 AI 자동 웹 검색이 실시간으로 작동합니다."
        };
      }
      async function fetchAiTentSpecFromWeb(query) {
        const cached = readAiTentCache(query);
        if (cached &amp;&amp; cached.ok &amp;&amp; (Array.isArray(cached.candidates) ? cached.candidates.length &gt; 0 : cached.tent)) {
          return { ...cached, fromLocalCache: true };
        }
        const isHttp = window.location &amp;&amp; /^https?:\/\//i.test(window.location.href);
        if (!isHttp) {
          try {
            const direct = await callDirectGeminiSimple(query);
            if (direct &amp;&amp; direct.ok) writeAiTentCache(query, direct);
            return direct;
          } catch (err) {
            return { ok: false, code: "PREVIEW_ERR", error: "미리보기 환경 AI 검색에 실패했습니다. Vercel 배포 사이트에서 api/tent-search.js와 GEMINI_API_KEY를 확인해 주세요." };
          }
        }
        const ctrl = new AbortController();
        const timer = setTimeout(() =&gt; ctrl.abort(), 8000);
        try {
          const res = await fetch(`/api/tent-search?q=${encodeURIComponent(query)}`, { signal: ctrl.signal });
          clearTimeout(timer);
          const data = await res.json().catch(() =&gt; null);
          if (res.ok &amp;&amp; data &amp;&amp; data.ok) {
            writeAiTentCache(query, data);
            return data;
          }
          if (res.status === 429) {
            return { ok: false, code: "RATE_LIMITED", error: (data &amp;&amp; data.error) || "요청이 너무 많습니다. 잠시 후 다시 시도하거나 아래 슬라이더로 직접 입력해 주세요." };
          }
          if (res.status === 404 &amp;&amp; !data) {
            return { ok: false, code: "API_NOT_DEPLOYED", error: "Vercel 프로젝트의 api/tent-search.js 파일이 배포되지 않았습니다." };
          }
          return data || { ok: false, code: "HTTP_ERR", error: `검색 요청 실패 (HTTP ${res.status})` };
        } catch (err) {
          clearTimeout(timer);
          return { ok: false, code: "NETWORK_ERR", error: err?.name === "AbortError" ? "AI 검색 응답이 지연(8초 초과)되었습니다. 아래 슬라이더로 텐트·홀잭 높이를 직접 입력해 주세요." : "AI 검색 서버에 연결하지 못했습니다. 아래 슬라이더로 직접 입력해 주세요." };
        }
      }

      const runSimpleSearch = async (forceWebAi = false) =&gt; {

            : (aiRes &amp;&amp; aiRes.error)

      document.getElementById("goProVersionBtn").addEventListener("click", () =&gt; {

        params.set("path", st.path); if(st.path==="elbow90")params.set("support",st.horizontalSupport); params.set("elbowStart",st.elbowStart); if(st.wallMount==="first")params.set("wallMount","first"); if(st.elbowStart==="drag")params.set("wallSteps",String(st.wallSteps));

      });

      let hasSharedPos = false;
      (function applyIncomingParamsSimple() {
        try {
          const p = new URLSearchParams(window.location.search);
          const tId = p.get("tent") || "";
          const tName = p.get("tname") || "";
          if (tId || tName) {
            const mappedTid = PRO_TO_SIMPLE_TENT_ID[tId] || tId;
            let found = TENTS.find((x) =&gt; x.id === mappedTid || x.id === tId || tId.endsWith("_" + x.id));
            if (!found &amp;&amp; tName) {
              const nq = normalizeSearchStr(tName);
              found = TENTS.find((x) =&gt; normalizeSearchStr(x.name).includes(nq));
            }
            if (found) {
              st.tentId = found.id;
              st.tentH = found.h;
              st.jackH = found.jh;
              st.path = found.path;

          }
          const stoveParam = p.get("stove");
          if (stoveParam) {
            const foundStove = STOVES.find((s) =&gt; s.id === stoveParam || stoveParam.startsWith(s.id));
            if (foundStove) {
              st.stoveId = foundStove.id;
              st.stoveH = foundStove.h;
              st.pipeSys = foundStove.pipe;
            }
          }
          const th = p.get("th") !== null ? Number(p.get("th")) : NaN;
          if (Number.isFinite(th) &amp;&amp; th &gt;= 130 &amp;&amp; th &lt;= 350) st.tentH = th;
          const jh = p.get("jh") !== null ? Number(p.get("jh")) : NaN;
          if (Number.isFinite(jh) &amp;&amp; jh &gt;= 80 &amp;&amp; jh &lt;= 350) st.jackH = jh;
          const sh = p.get("sh") !== null ? Number(p.get("sh")) : NaN;
          if (Number.isFinite(sh) &amp;&amp; sh &gt;= 20 &amp;&amp; sh &lt;= 90) st.stoveH = sh;
          const stH = p.get("st") !== null ? Number(p.get("st")) : NaN;
          if (Number.isFinite(stH) &amp;&amp; stH &gt;= 0 &amp;&amp; stH &lt;= 80) st.standH = stH;
          const path = p.get("path");
          if(["rest","pole","both"].includes(p.get("support")))st.horizontalSupport=p.get("support");
          if(path) st.elbowStart=["outlet","drag"].includes(p.get("elbowStart"))?p.get("elbowStart"):"raised";
          st.wallMount=p.get("wallMount")==="first"?"first":"auto";
          st.wallSteps=Math.max(0,Math.min(20,Math.trunc(Number(p.get("wallSteps"))||0)));
          if (["straight", "elbow45", "elbow90"].includes(path)) st.path = path;
          const pipe = p.get("pipe");
          if (["tapered_70_73_76", "mixed_70_75", "single_70", "single_75", "ti_nested_70_76", "ti_single_70_76", "ti_nested_83_89"].includes(pipe)) st.pipeSys = pipe;
          st.mixedAuto=p.get("mixedAuto")==="1" || (!p.has("mixedAuto") &amp;&amp; pipe==="mixed_70_75");
          st.mixedDamper=p.get("mixedDamper")==="1";
          st.mixedCap=["standard","double","none"].includes(p.get("mixedCap"))?p.get("mixedCap"):pipe==="mixed_70_75"?"double":"none";
          st.doubleSpark=p.get("doublecap")==="1";
          for(const [k,target,field,max] of [["ringH",rigState,"height",5000],["meshPos",rigState,"mesh",100]]){
            const v=Number(p.get(k));if(p.has(k)&amp;&amp;Number.isFinite(v)&amp;&amp;v&gt;=0&amp;&amp;v&lt;=max)target[field]=v;
          }
          const prot = p.get("prot");
          if (["double_pipe", "mesh_guard", "both_guard", "ti_guard_70"].includes(prot)) st.protSys = prot;
          const ex = p.get("ex") !== null ? Number(p.get("ex")) : NaN;
          if (Number.isFinite(ex) &amp;&amp; ex &gt;= -4 &amp;&amp; ex &lt;= 6) st.extraOutPipes = ex;
          for(const d of [70,73,75,76]) st.added[d]=Math.max(0,Math.min(50,Math.trunc(Number(p.get("add"+d))||0)));
          if(ex&gt;0 &amp;&amp; pipeSizes().length &amp;&amp; ![70,73,75,76].some(d=&gt;p.has("add"+d))) st.added[pipeSizes().at(-1)]=ex;
          const bw=Number(p.get("bw")),bd=Number(p.get("bd"));
          if(bw&gt;=1&amp;&amp;bw&lt;=250&amp;&amp;bd&gt;=1&amp;&amp;bd&lt;=250) bodySizes.set(st.stoveId,{width:bw,depth:bd});
          for(const angle of [45,90]){const leg=Number(p.get("e"+angle));if(leg&gt;=4&amp;&amp;leg&lt;=50)elbowLegs[angle]=leg;}
          if(p.get("view")==="side")st.view="side";
          const pos = p.get("pos") !== null ? Number(p.get("pos")) : NaN;
          const jpos = p.get("jpos") !== null ? Number(p.get("jpos")) : NaN;
          if(p.has("bearing")&amp;&amp;Number.isFinite(Number(p.get("bearing"))))st.bearing=((Math.round(Number(p.get("bearing")))%360)+360)%360;
          if (p.has("depth"))st.planDepth=clampDepth(Number(p.get("depth")));
          if (Number.isFinite(pos)) { st.stovePosCm = clampPos(pos); hasSharedPos = true; }
          if (Number.isFinite(jpos)) { st.jackPosCm = Math.round(jpos); hasSharedPos = true; }
        } catch (err) {}
      })();

      (async function syncSimpleProductsFromServer() {
        const isHttp = window.location &amp;&amp; /^https?:\/\//i.test(window.location.href);
        if (!isHttp) return;
        try {
          const res = await fetch("/api/products", { cache: "no-store" });
          const data = await res.json().catch(() =&gt; null);
          if (!res.ok || !data || !data.ok || !Array.isArray(data.products) || !data.products.length) return;
          const byNo = {};
          Object.values(PRODUCTS).forEach((p) =&gt; {
            const m = String(p.url || "").match(/\/products\/(\d+)/);
            if (m) byNo[m[1]] = p;
          });
          data.products.forEach((r) =&gt; {
            if (!r || !r.name) return;
            const no = String(r.productNo || (String(r.url || "").match(/\/products\/(\d+)/) || [])[1] || "").trim();
            const target = (no &amp;&amp; byNo[no]) || (r.id &amp;&amp; !/^\d+$/.test(String(r.id)) &amp;&amp; PRODUCTS[r.id]) || null;
            if (target) {
              if (r.deleted) { target.deleted = true; target.status = "삭제됨"; }
              else {
                target.deleted = false;
                target.name = r.name;
                if (typeof r.price === "number" &amp;&amp; r.price &gt; 0) target.price = r.price;
                if (r.status) target.status = r.status;
                if (r.url &amp;&amp; /^https?:\/\//i.test(r.url)) target.url = r.url;
              }
            } else if (!r.deleted &amp;&amp; r.isChimneyAccessory !== false) {
              const nid = no ? `naver_${no}` : (r.id &amp;&amp; !PRODUCTS[r.id] ? String(r.id) : `naver_${Date.now()}`);

            }

          STOVES.forEach((s) =&gt; {

            const prefix = s.mat === "titanium" ? "[티타늄]" : "[스텐]";

          });

          if (sSel) {

          }

        } catch (err) {}
      })();

      (async function syncSimpleTentsFromServer() {
        const isHttp = window.location &amp;&amp; /^https?:\/\//i.test(window.location.href);
        if (!isHttp) return;
        try {
          const ep = (() =&gt; {
            try { return localStorage.getItem("ct_pro_tent_sync_endpoint") || "/api/tents"; } catch (e) { return "/api/tents"; }
          })();
          const res = await fetch(ep, { cache: "no-store" });
          const data = await res.json().catch(() =&gt; null);
          if (!res.ok || !data || !data.ok || !Array.isArray(data.tents) || !data.tents.length) return;

          let changed = 0;
          let selectedUpdated = null;
          const addedList = [];

          for (let i = 0; i &lt; data.tents.length; i++) {
            const rt = data.tents[i];
            if (!rt || !rt.id) continue;
            const mappedId = PRO_TO_SIMPLE_TENT_ID[rt.id] || rt.id;
            const idx = TENTS.findIndex((x) =&gt; x.id === mappedId || x.id === rt.id);

            if (rt.deleted) {
              if (idx !== -1 &amp;&amp; TENTS[idx].id !== "custom_tent") {
                TENTS.splice(idx, 1);
                changed++;
              }
              continue;
            }

            if (!rt.brand || !rt.name) continue;
            const origin = rt.origin === "해외" ? "해외" : "국내";
            const w = Math.max(150, Math.min(800, Math.round(Number(rt.w) || 340)));
            const l = Math.max(150, Math.min(1000, Math.round(Number(rt.l) || 400)));
            const h = Math.max(130, Math.min(350, Math.round(Number(rt.peakHeight) || 200)));
            const sw = Math.max(0, Math.min(350, Math.round(typeof rt.sw === "number" ? rt.sw : Math.round(h * 0.6))));
            const jh = Math.max(80, Math.min(320, Math.round(Number(rt.defaultJackHeight) || 150)));
            const path = ["straight", "elbow45", "elbow90"].includes(rt.defaultPath) ? rt.defaultPath : "straight";
            const shape = ["dome", "tipi", "tunnel", "cabin"].includes(rt.shape) ? rt.shape : "dome";
            const displayName = `[${origin}] ${rt.brand} ${rt.name} (${l}×${w}×${h})`;

            if (idx !== -1) {
              const keepId = TENTS[idx].id;
              TENTS[idx] = { id: keepId, name: displayName, shape, w, l, h, sw, jh, path, isSupabase: true };
              if (st.tentId === keepId) selectedUpdated = TENTS[idx];
              changed++;
            } else {
              addedList.push({ id: rt.id, name: displayName, shape, w, l, h, sw, jh, path, isSupabase: true });
              changed++;
            }
          }

          if (addedList.length &gt; 0) {
            TENTS.unshift(...addedList);
          }

          if (!changed) return;

          if (!TENTS.some((x) =&gt; x.id === st.tentId)) {
            const fbTent = TENTS.find((x) =&gt; x.id !== "custom_tent") || TENTS[0];
            if (fbTent) {
              st.tentId = fbTent.id;
              st.tentH = fbTent.h;
              st.jackH = fbTent.jh;
              st.path = fbTent.path;
              resetPos();
            }
          } else if (selectedUpdated) {
            const p0 = new URLSearchParams(window.location.search);
            if (p0.get("th") === null) st.tentH = selectedUpdated.h;
            if (p0.get("jh") === null) st.jackH = selectedUpdated.jh;
            if (!p0.get("path")) st.path = selectedUpdated.path;
          }

          const tSelEl = document.getElementById("sTentSelect");
          if (tSelEl) {
            tSelEl.innerHTML = "";
            TENTS.forEach((t) =&gt; {
              const o = document.createElement("option");
              o.value = t.id;
              o.textContent = t.name;
              tSelEl.appendChild(o);
            });
            tSelEl.value = st.tentId;
          }
          const cntBadge = document.getElementById("sTentCountBadge");
          if (cntBadge) cntBadge.textContent = `${Math.max(0, TENTS.length - 1)}종 + AI검색`;

          const p = new URLSearchParams(window.location.search);
          const urlTentId = p.get("tent") || "";
          if (urlTentId) {
            const mappedUrlId = PRO_TO_SIMPLE_TENT_ID[urlTentId] || urlTentId;
            const matched = TENTS.find((x) =&gt; x.id === mappedUrlId || x.id === urlTentId);
            if (matched &amp;&amp; matched.id !== st.tentId) {
              st.tentId = matched.id;
              if (p.get("th") === null) st.tentH = matched.h;
              if (p.get("jh") === null) st.jackH = matched.jh;
              if (!p.get("path")) st.path = matched.path;
              if (!hasSharedPos) resetPos();
              if (tSelEl) tSelEl.value = st.tentId;
            }
          }
          syncInputs();
          render();
        } catch (err) {}
      })();
    }

    if (document.readyState === "loading") {
      document.addEventListener("DOMContentLoaded", initApp);
    } else {
      initApp();
    }

 try{await navigator.clipboard.writeText(source.value)}
 catch{source.focus();source.select();source.setSelectionRange(0,source.value.length);let ok=false;try{ok=document.execCommand('copy')}catch{}if(!ok){msg.textContent='전체 코드를 선택했습니다. Ctrl+C 또는 선택 메뉴의 복사를 누르세요.';return}}
 msg.textContent='전체 코드를 복사했습니다.';
};
</script></html>
