name: Sync Naver Commerce to Supabase

on:
  schedule:
    - cron: '0 22 * * *' # 매일 한국시간 오전 7시(UTC 22:00) 자동 실행
  workflow_dispatch: # GitHub Actions 탭에서 수동 실행 버튼 활성화

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install @supabase/supabase-js bcryptjs

      - name: Run Naver sync script
        env:
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/sync-naver.mjs
